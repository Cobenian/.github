# Merge the bot's and Dependabot's pull requests once CI and the guard pass, so updates reach
# production with nobody clicking. The guard (the caller's main copy, never the pull request's)
# keeps back anything that needs the approver; those are assigned to them with the reasons, and
# merge here once the approver adds the approval label after the branch's latest push (the same
# check as aws-guard, in identical text: a label from anyone else, or from before the latest push,
# doesn't count). The caller's main should also require the guard check, so no other path can
# merge them either.
#
# The pull request is found by the run's head sha (workflow_run.pull_requests, else GitHub's
# commit-to-PR lookup), never by branch name: a Guard run triggered by pull_request_target can
# report the base branch as its head_branch.
#
# The merge uses a GitHub App token: merges made with the built-in token don't start other
# workflows, so the deploy would never run. The App's id and key are secrets of the caller's
# `environment` (default "engineer"), so only this job can read them.
#
# Extracted from cobenian-company's automerge.yml (2026-11-03). AWS apps call it at @v2.
#
#   on:
#     workflow_run:
#       workflows: ["CI", "Guard"]
#       types: [completed]
#   jobs:
#     merge:
#       if: vars.AUTOMERGE_ENABLED == 'true'
#       uses: Cobenian/.github/.github/workflows/aws-automerge.yml@v2
#       with: { bots: "app/dependabot" }
#       secrets: inherit
name: Automerge

on:
  workflow_call:
    inputs:
      bots:
        description: Space-separated PR author logins (as gh prints them) the loop may merge (e.g. "app/dependabot app/my-bot")
        type: string
        default: app/dependabot
      environment:
        description: The environment holding the App's id and key secrets
        type: string
        default: engineer
      app-id-secret:
        description: Name of the environment secret holding the GitHub App's id
        type: string
        default: ENGINEER_APP_ID
      app-key-secret:
        description: Name of the environment secret holding the GitHub App's private key
        type: string
        default: ENGINEER_APP_KEY
      guard-command:
        description: The caller's guard script, run from main as `<command> <base> <head>`; exits 0 to pass
        type: string
        default: bin/guard
      approver:
        description: The only login whose label counts as approval
        type: string
        default: brweber2
      approval-label:
        description: The label the approver adds, after the latest push, to approve a held change
        type: string
        default: bryan-approved

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets[inputs.app-id-secret] }}
          private-key: ${{ secrets[inputs.app-key-secret] }}

      - name: Which pull request, and is it one the loop may merge?
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          BOTS: ${{ inputs.bots }}
        run: |
          # By head sha, never by branch name (a pull_request_target run may name the base branch).
          # Candidates: the run's own pull_requests, plus GitHub's commit-to-PR lookup; kept only if
          # open, in this repository, and with exactly this head.
          { printf '%s' "$RUN_PRS" | jq -r '.[]?.number' || true
            gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[].number'
          } | sort -un > candidates.txt
          : > matches.txt
          while read -r c; do
            [ -n "$c" ] || continue
            gh api "repos/$GITHUB_REPOSITORY/pulls/$c" \
              | jq -c --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
                  'select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo)
                   | {number, author: (if .user.type == "Bot" then "app/" + (.user.login | sub("\\[bot\\]$"; "")) else .user.login end)}' >> matches.txt
          done < candidates.txt
          [ "$(grep -c . matches.txt || true)" -le 1 ] || { echo "More than one open PR has head $HEAD_SHA; merge by hand."; exit 0; }
          number=$(jq -r '.number // empty' matches.txt); author=$(jq -r '.author // empty' matches.txt)
          [ -n "$number" ] || { echo "No open PR in this repository has head $HEAD_SHA (it may have moved on)."; exit 0; }
          case " $BOTS " in
            *" $author "*) ;;
            *) echo "PR #$number is by $author; people merge their own."; exit 0 ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.pr.outputs.number
        # main's tree: the guard that judges the change is never the change's own copy.
        with: { ref: main, fetch-depth: 0, token: "${{ steps.app.outputs.token }}" }

      - name: Guard, then merge
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GUARD: ${{ inputs.guard-command }}
          APPROVER: ${{ inputs.approver }}
          LABEL: ${{ inputs.approval-label }}
        run: |
          # --- Approval check. IDENTICAL text in aws-guard.yml and aws-automerge.yml: change both. ---
          # Approved means all of:
          #   - the PR's head is still $HEAD_SHA, on a branch of this repository (a fork's PR is
          #     never approved by label);
          #   - the approval label is on the PR now;
          #   - the issue events show a `labeled` event for that label, by $APPROVER, created after
          #     the branch's latest push.
          # "Latest push" is GitHub's own record of the branch moving: the repository activity API
          # (GET /repos/{repo}/activity?ref=refs/heads/<branch>, newest first), whose entries
          # (push, force_push, branch_creation, ...) carry a server-side timestamp and the sha the
          # branch moved to. The newest entry must have moved the branch to $HEAD_SHA, or this
          # fails closed. A commit's author/committer dates are never used: whoever writes the
          # commit chooses them. Check-suite times aren't either: a sha pushed earlier to another
          # branch already has suites from before it became this PR's head.
          # Every page of events is read, and the matches are counted as lines.
          approved() {
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$N") || { echo "Couldn't read PR #$N."; return 1; }
            if [ "$(printf '%s' "$pr" | jq -r .head.sha)" != "$HEAD_SHA" ]; then
              echo "PR #$N has moved past $HEAD_SHA."; return 1
            fi
            if [ "$(printf '%s' "$pr" | jq -r .head.repo.full_name)" != "$GITHUB_REPOSITORY" ]; then
              echo "PR #$N's branch is in another repository; a label can't approve it."; return 1
            fi
            if ! printf '%s' "$pr" | jq -e --arg l "$LABEL" 'any(.labels[]; .name == $l)' >/dev/null; then
              echo "PR #$N doesn't carry $LABEL."; return 1
            fi
            ref=$(printf '%s' "$pr" | jq -r '"refs/heads/" + .head.ref | @uri')
            last=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/activity?ref=$ref&direction=desc&per_page=1" \
              --jq '.[0] | "\(.timestamp) \(.after)"') || { echo "Couldn't read the branch's push history."; return 1; }
            pushed=${last%% *}; after=${last#* }
            if [ "$after" != "$HEAD_SHA" ] || [ -z "$pushed" ] || [ "$pushed" = null ]; then
              echo "GitHub's newest record of the branch ('$last') isn't the push of $HEAD_SHA."; return 1
            fi
            count=$(gh api --paginate -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/issues/$N/events?per_page=100" \
              | jq -r --arg l "$LABEL" --arg who "$APPROVER" --arg t "$pushed" \
                  '.[] | select(.event == "labeled" and .label.name == $l and .actor.login == $who and .created_at > $t) | .created_at' \
              | grep -c .) || true
            if [ "${count:-0}" -gt 0 ]; then echo "$APPROVER added $LABEL after the latest push ($pushed)."; return 0; fi
            echo "No $LABEL label from $APPROVER after the latest push ($pushed)."; return 1
          }
          # --- End of the approval check. ---
          git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
          if reasons=$($GUARD origin/main "$HEAD_SHA") || approved; then
            # Fails harmlessly while a required check is still running or failed.
            gh pr merge "$N" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA" ||
              echo "Not mergeable yet (a required check hasn't passed); the next check to finish tries again."
          elif gh pr view "$N" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("needs-bryan") != null' | grep -qx true; then
            echo "Already waiting for $APPROVER."
          else
            gh label create needs-bryan -R "$GITHUB_REPOSITORY" --color FBCA04 --force >/dev/null
            gh pr edit "$N" -R "$GITHUB_REPOSITORY" --add-label needs-bryan --add-assignee "$APPROVER"
            gh pr comment "$N" -R "$GITHUB_REPOSITORY" --body "CI passed, but this one is yours to merge.

          $reasons

          Read the diff for the items above. If they're what you want, add the label **$LABEL** (it must be you, after the latest push) and it merges and deploys on its own."
          fi
