# BUILD adapter. Produces an artifact and records it. Deploys nothing, anywhere.
#
# specs/artifact-and-promotion.md §3.1: build and promotion are separate operations with
# separate adapters (#1); a build MUST NOT name a target environment or be parameterised
# by one (#2); and a promotion MUST NOT be able to build (#3). Until now `flyctl deploy`
# did both at once, which meant two builds of the same commit could differ — base image
# drift, apt versions — so nothing could honestly claim that what was tested is what
# shipped. That is the gap this closes, and it is the precondition for promotion between
# environments meaning anything at all.
#
# `registry_app` is where the image is STORED, not where it runs. Fly namespaces its
# registry by app, so an image has to live under some app's name; that is a storage
# address and not an environment binding. The same artifact is promoted unchanged to any
# environment by digest.
name: Fly build (reusable)

on:
  workflow_call:
    inputs:
      head_sha:
        description: "Full 40-character commit being built."
        required: true
        type: string
      registry_app:
        description: >-
          Fly app whose registry namespace stores the image. A storage address, NOT a
          deployment target — nothing is deployed by this workflow.
        required: true
        type: string
      uses_hex_org_key:
        required: false
        type: boolean
        default: false
      gate:
        description: "pass | fail | not_run — the CI result for head_sha, recorded honestly."
        required: false
        type: string
        default: "not_run"
      ledger_bucket:
        required: false
        type: string
        default: "cobenian-fleet-ledger"
      ledger_endpoint:
        required: false
        type: string
        default: "https://fly.storage.tigris.dev"
      ledger_prefix:
        description: "Key prefix. The bucket will hold other things; the ledger stays under one namespace."
        required: false
        type: string
        default: "ledger/"
    outputs:
      image_ref:
        description: "Immutable, digest-pinned image reference. The artifact id."
        value: ${{ jobs.build.outputs.image_ref }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      FLY_API_TOKEN:
        required: true
      HEX_ORG_KEY:
        required: false
      HEX_FLEET_KEY:
        required: false
      LEDGER_ACCESS_KEY_ID:
        required: false
      LEDGER_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}

      # #6: a build MUST NOT be recorded for a short or null source sha. An artifact whose
      # source is unknown is not promotable, and that is a different fact from no artifact.
      - name: Source sha must be full length
        run: |
          set -euo pipefail
          case "${{ inputs.head_sha }}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::head_sha must be a full 40-character sha (got '${{ inputs.head_sha }}')"; exit 1 ;;
          esac

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Build and push, deploying nothing
        id: push
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEX_ORG_KEY: ${{ secrets.HEX_ORG_KEY }}
          HEX_FLEET_KEY: ${{ secrets.HEX_FLEET_KEY }}
          SHA: ${{ inputs.head_sha }}
        run: |
          set -uo pipefail
          args="--build-only --push --remote-only -a ${{ inputs.registry_app }}"
          args="$args --image-label sha-${SHA:0:12} --build-arg GIT_SHA=$SHA"
          if [ "${{ inputs.uses_hex_org_key }}" = "true" ]; then
            args="$args --build-secret hex_org_key=$HEX_ORG_KEY"
          fi
          # KEYED ON PRESENCE, deliberately unlike the line above, and the asymmetry is
          # the point rather than an oversight.
          #
          # The Dockerfile's `--mount=type=secret,id=hex_fleet_key` IS the declaration
          # that a build needs this key. A `uses_hex_fleet_key` input would state the same
          # fact a second time, in a second file, free to drift from the first -- and a
          # fact stated twice is how `fly_app` and `tracks = "continuous"` both went wrong
          # this week. One declaration, in the file that consumes it.
          #
          # Passing a build-secret the Dockerfile does not mount is inert: BuildKit ignores
          # it. So presence-keying is self-limiting, and it needs no caller change, which
          # closes the hazard below one step sooner than an input would.
          #
          # WHAT IT FIXES. cobenian-assay's Dockerfile mounts BOTH hex_org_key and
          # hex_fleet_key; this workflow passed only the first. The unmounted-but-declared
          # secret resolves to an EMPTY FILE rather than an error, so the build takes its
          # "no key in this build" branch and strips the `fleet` organisation out of the
          # lock -- successfully, greenly, and silently. Harmless only while nothing
          # depends on a `fleet` package, and wrong the moment something does.
          if [ -n "${HEX_FLEET_KEY:-}" ]; then
            args="$args --build-secret hex_fleet_key=$HEX_FLEET_KEY"
          fi

          flyctl deploy $args 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::build failed"; exit "$rc"; }

          # THE DIGEST IS NOT IN flyctl's SUMMARY. Its closing line prints only the tag —
          #   image: registry.fly.io/app:sha-0f980929051a
          # while the digest appears solely in BuildKit's push output:
          #   pushing manifest for registry.fly.io/app:sha-...@sha256:35a0f97c...
          # Parsing the obvious line would record a TAG as the artifact id, which
          # artifact-and-promotion #5 forbids: a tag is mutable and can be repointed, so an
          # artifact identified by one is not an artifact. Verified against a real build
          # before this was written.
          # ONLY the `pushing manifest for` line. A build log carries other digests that
          # are not this artifact — base images pulled by `FROM ... @sha256:` among them.
          # The first version of this grepped every `@sha256:` in the log, found three on a
          # real CI build, and correctly REFUSED rather than picking one; two were base
          # image layers. Refusing was right and the extraction was wrong.
          manifests="$(grep -E 'pushing manifest for ' build.log \
                       | grep -oE '@sha256:[0-9a-f]{64}' | tr -d '@' | sort -u)"
          count="$(printf '%s\n' "$manifests" | grep -c . || true)"

          if [ "$count" -eq 0 ]; then
            echo "::error title=No digest::The push produced no manifest digest. Recording a tag as the artifact id is forbidden (artifact-and-promotion #5), so this build is not recorded."
            exit 1
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error title=Ambiguous digest::$count manifests were pushed; refusing to guess which is the artifact."
            printf '  %s\n' $manifests
            exit 1
          fi
          digest="$manifests"

          ref="registry.fly.io/${{ inputs.registry_app }}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Artifact $ref"

      # §3.2. `reversible` is recorded as unknown, which #12 requires be treated as
      # `narrow` everywhere — the conservative reading. Classifying each migration is the
      # next increment; claiming reversibility we have not computed would be worse than
      # admitting we have not computed it.
      - name: Record the artifact
        env:
          SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          # When the build happened. github.event.repository.updated_at is when the
          # REPOSITORY last changed, which is a different fact and drifts from this one by
          # however long the queue and build took — five minutes on the first real run.
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILT_AT
          # Migration FILES only. `.formatter.exs` lives in that directory and is not a
          # migration; the first version listed it, which would put a non-migration into a
          # record whose whole purpose is deciding whether a promotion is reversible.
          # `grep` exits 1 when it matches nothing, and under `set -o pipefail` that failed
          # the whole step. An app with NO migrations is not an error: a service with no
          # Ecto repo legitimately has none, and the first one to try it could not be built
          # at all. `|| true` keeps a genuine grep failure from being masked while letting
          # "no matches" mean an empty list, which is what it means.
          mig="$(git ls-tree -r --name-only HEAD | { grep -E 'priv/repo/migrations/[0-9]{14}_.*\.exs$' || true; } | sort | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          python3 - <<PY > artifact.json
          import json, os
          print(json.dumps({
            "artifact_id": "${{ steps.push.outputs.digest }}",
            "image_ref": "${{ steps.push.outputs.image_ref }}",
            "source_repo": "${{ github.repository }}",
            "source_sha": os.environ["SHA"],
            "built_at": os.environ["BUILT_AT"],
            "builder": "github-actions:${{ github.run_id }}",
            "gate": "${{ inputs.gate }}",
            "migrations": json.loads('''$mig'''),
            "reversible": "unknown",
            "scan": "not_run",
          }, indent=2))
          PY
          cat artifact.json
          { echo '### Artifact'; echo '```json'; cat artifact.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"


      # Append the record to the ledger. Same contract as
      # cobenian-fleet bundles/cobenian/scripts/ledger, whose ledger-selftest proves the
      # two properties this depends on: one object per record so concurrent promotions
      # cannot lose each other, and a read-back so a write that did not land is reported
      # as a failure rather than a success.
      #
      # Skipped, loudly, when no credentials are configured. A build that silently does
      # not record its artifact is worse than one that refuses: the artifact would exist
      # and be promotable with nothing in the ledger saying where it came from.
      - name: Append the artifact record to the ledger
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LEDGER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEDGER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: "3"
          BUCKET: ${{ inputs.ledger_bucket }}
          ENDPOINT: ${{ inputs.ledger_endpoint }}
          PREFIX: ${{ inputs.ledger_prefix }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning title=Artifact not recorded::No ledger credentials configured, so this artifact exists but is not in the ledger. A promotion that requires a ledger record will refuse it."
            exit 0
          fi
          key="${PREFIX}artifacts/${{ github.repository }}/$(echo '${{ steps.push.outputs.digest }}' | tr ':' '-').json"

          if aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "Already recorded: $key"
            exit 0
          fi
          aws s3api --endpoint-url "$ENDPOINT" put-object --bucket "$BUCKET" --key "$key" \
            --body artifact.json --content-type application/json >/dev/null

          # Read back. A put returning 0 is not evidence the object is there.
          aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null \
            || { echo "::error title=Artifact not recorded::Wrote $key but it is not readable back — treating as NOT recorded."; exit 1; }
          echo "Recorded $key"

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-record-${{ inputs.head_sha }}
          path: artifact.json
          retention-days: 90
