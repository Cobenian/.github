# PROMOTION adapter. Binds an artifact that already exists to one environment.
#
# specs/artifact-and-promotion.md #3: a promotion MUST NOT produce an artifact — "if a
# promotion adapter can compile, fetch dependencies, or resolve a version range, it is a
# build". This one takes a digest-pinned image and calls `flyctl deploy --image`, which has
# no build path. It never checks out the source, so it structurally cannot build: the
# repository is not present in the job. (It does sparse-checkout the single deploy-time
# config file — see "Fetch the deploy-time config" — which is a declarative TOML and not a
# build path; without it flyctl silently deploys Fly's server-side config instead of the
# repo's.)
#
# That is the difference from the old fly-deploy.yml, which built and deployed in one step.
# Two builds of the same commit can differ — base image drift, apt versions — so nothing
# could honestly claim that what was verified is what shipped. Promotion by digest can.
name: Fly promote (reusable)

on:
  workflow_call:
    inputs:
      image_ref:
        description: "Digest-pinned image from the build adapter. MUST contain @sha256:."
        required: true
        type: string
      app:
        description: "Fly app to bind the artifact to. THIS names the environment."
        required: true
        type: string
      app_domain:
        required: true
        type: string
      head_sha:
        description: "Source sha the artifact was built from, asserted against /version."
        required: true
        type: string
      version_path:
        required: false
        type: string
        default: "/version"
      ready_path:
        description: "Probed after binding and REPORTED. Never gates (observation.md #21)."
        required: false
        type: string
        default: ""
      ledger_bucket:
        required: false
        type: string
        default: "cobenian-fleet-ledger"
      ledger_endpoint:
        required: false
        type: string
        default: "https://fly.storage.tigris.dev"
      ledger_prefix:
        description: "Key prefix. The bucket will hold other things; the ledger stays under one namespace."
        required: false
        type: string
        default: "ledger/"
      config_path:
        description: >-
          The app's deploy-time config, read from the source at `head_sha` and passed to
          `flyctl deploy -c`. Without it flyctl silently uses Fly's SERVER-SIDE copy of the
          app config instead, so nothing in the repo's fly.toml ever reaches the platform.
          Set to "" to keep that older behaviour deliberately.
        required: false
        type: string
        default: "fly.toml"
      require_tip:
        description: >-
          Refuse to promote a source sha that is no longer the tip of the default branch.
          TRUE for automatic CD. FALSE for a deliberate promotion of an older artifact —
          a rollback, or promoting a verified artifact onward — which is the whole point
          of having a ledger and must not be blocked.
        required: false
        type: boolean
        default: false
      declared_app:
        description: >-
          The name this application has in the FLEET MANIFEST, which is not always the Fly
          app name. `app` above is the platform's name and is what the promote command
          needs; this is what the fleet calls the same thing, and the two differ today for
          cobenian_companion_umbrella, whose Fly app is cobenian-companion.

          Supplied so the binding can carry a subject a reader can join against the
          declaration WITHOUT resolving an alias. This workflow is the only participant
          holding both names at once, so resolving it anywhere else is guesswork.

          OPTIONAL, AND OMITTED RATHER THAN GUESSED WHEN ABSENT. It would be correct today
          to derive it from the repository name — measured against the manifest, `name`
          equals `repo` for all eight deployable apps — but that is a convention nobody
          enforces, and a derived value that is right today and silently wrong later is the
          failure this fleet keeps removing. A binding with no `subject` honestly says this
          writer did not state one.
        required: false
        type: string
        default: ""
      env_name:
        description: "Environment this binding is to. One value today; the key exists so a second costs nothing."
        required: false
        type: string
        default: "prod"
    secrets:
      FLY_API_TOKEN:
        required: true
      LEDGER_ACCESS_KEY_ID:
        required: false
      LEDGER_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote to ${{ inputs.app }}
    runs-on: ubuntu-latest
    concurrency: promote-${{ inputs.app }}
    steps:
      # No checkout. A promotion that cannot see the source cannot build from it, which is
      # #3 enforced by construction rather than by discipline.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # #14: a promotion MUST bind an artifact that already exists. A tag is not an
      # artifact — it is mutable and can be repointed between verification and promotion,
      # which is exactly the substitution this whole separation exists to prevent.
      - name: Refuse anything that is not digest-pinned
        run: |
          set -euo pipefail
          case "${{ inputs.image_ref }}" in
            *@sha256:*) echo "Promoting ${{ inputs.image_ref }}" ;;
            *) echo "::error title=Not an artifact::image_ref must be digest-pinned (…@sha256:…). A tag can be repointed after verification, so promoting one binds something nobody verified."; exit 1 ;;
          esac


      # ── Freshness gate (the stale-deploy fix), for automatic CD only ─────────
      #
      # CI runs take minutes. When two merges land close together the OLDER commit's CI
      # can finish AFTER the newer merge, shipping older code over newer with a green
      # check. Observed 2026-08-02 in cobenian-panel: #184 merged at 14:44, #183's CI
      # finished at 14:45:28 and deployed its own older sha, and the run list labelled it
      # with the NEWER sha so nothing surfaced it.
      #
      # It lives HERE rather than in the build because separating the two changed where
      # the risk is. Building a superseded commit is harmless — it produces an artifact
      # nobody promotes. Promoting one is the bug. And it is conditional, because after
      # the separation "promote an artifact that is not the tip" is a legitimate act:
      # that is what a rollback is, and what promoting a verified artifact onward to
      # another environment is. Only automatic CD sets require_tip.
      #
      # Skipping is always safe: whatever is now the tip has, or will have, its own run.
      - name: Check the source is still the tip of the default branch
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.require_tip }}" != "true" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Deliberate promotion — tip check not requested."
            exit 0
          fi
          branch=$(gh api "repos/$REPO" --jq .default_branch)
          tip=$(gh api "repos/$REPO/commits/$branch" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Promoting $HEAD_SHA (tip of $branch)."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Promotion skipped (superseded)::$HEAD_SHA is no longer the tip of $branch (now $tip). Skipping so older code is not shipped over newer; the tip promotes from its own run."
          fi

      # artifact-and-promotion #14: a promotion MUST bind an artifact that already exists
      # in the ledger. This is the requirement the ledger exists to make enforceable, and
      # without it "build once, promote" is only a convention.
      #
      # Absence of credentials is NOT absence of the artifact. If the ledger cannot be
      # read, this cannot conclude the artifact is missing, so it warns and proceeds —
      # treating "could not check" as "not recorded" would block every promotion the
      # moment the ledger had a bad minute.
      - name: The artifact must already be in the ledger
        if: steps.freshness.outputs.fresh == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LEDGER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEDGER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: "3"
          BUCKET: ${{ inputs.ledger_bucket }}
          ENDPOINT: ${{ inputs.ledger_endpoint }}
          PREFIX: ${{ inputs.ledger_prefix }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning title=Ledger not checked::No ledger credentials, so this promotion could not confirm the artifact is recorded. Proceeding — could-not-check is not the same as not-recorded."
            exit 0
          fi
          digest="$(echo '${{ inputs.image_ref }}' | grep -oE 'sha256:[0-9a-f]{64}')"
          key="${PREFIX}artifacts/${{ github.repository }}/$(echo "$digest" | tr ':' '-').json"

          if aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "Artifact is in the ledger: $key"
            exit 0
          fi
          echo "::error title=Unrecorded artifact::$key is not in the ledger. Promoting an artifact nothing recorded means nothing can say what it was built from, whether its gate passed, or whether it is reversible."
          exit 1

      # ── The deploy-time config ────────────────────────────────────────────────
      #
      # `flyctl deploy --image` with no config file does NOT skip configuration. It fetches the
      # app config from the Fly API and updates every machine to match it, so Fly's server-side
      # copy wins and the repo's fly.toml is never applied — not its `[[vm]]`, not its health
      # checks, not its `[env]`. Editing fly.toml shipped nothing, and nothing said so. Every app
      # calling this workflow has that latent; cobenian-panel hit it on 2026-09-01, where a memory
      # bump to fit headless Chrome was reverted by each deploy and client invoices went out with
      # no PDF because Chrome was OOM-killed.
      #
      # **#3 still holds.** The invariant is that a promotion cannot BUILD, enforced by the source
      # not being present. A sparse checkout of one declarative TOML keeps that: there is no
      # mix.exs, no lockfile, no source tree — nothing to compile, no dependencies to fetch, no
      # version range to resolve. A config file is not a build path.
      #
      # Checked out at `head_sha`, not the branch tip: the config that ships must be the one that
      # belongs to the artifact being bound.
      - name: Fetch the deploy-time config
        if: steps.freshness.outputs.fresh == 'true' && inputs.config_path != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          sparse-checkout: ${{ inputs.config_path }}
          sparse-checkout-cone-mode: false
          path: __deploy_config

      - name: Bind the artifact
        if: steps.freshness.outputs.fresh == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          args="--image ${{ inputs.image_ref }} -a ${{ inputs.app }} --wait-timeout 15m"

          # Absent config is not an error — an app may legitimately keep its config on the
          # platform — but it is said out loud, because the failure it produces otherwise is a
          # fly.toml edit that appears to deploy and changes nothing.
          config="__deploy_config/${{ inputs.config_path }}"
          if [ -n "${{ inputs.config_path }}" ] && [ -f "$config" ]; then
            echo "Applying $config from ${{ inputs.head_sha }}"
            args="$args -c $config"
          else
            echo "::warning title=No deploy-time config::Deploying from Fly's stored app config. Anything in the repo's ${{ inputs.config_path }} will NOT be applied."
          fi

          flyctl deploy $args || {
            echo "::warning::First promotion attempt failed; retrying once."
            flyctl deploy $args
          }

      # A green promotion is not evidence the artifact is serving — the same reason
      # fly-deploy.yml asserts this. Only the app reporting its own commit closes the gap.
      - name: Verify the bound artifact is serving
        if: steps.freshness.outputs.fresh == 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.version_path }}"
          for _ in $(seq 1 20); do
            body=$(curl -fsS "$url" 2>/dev/null || true)
            case "$body" in *"$HEAD_SHA"*) echo "Verified: $url reports $HEAD_SHA."; exit 0 ;; esac
            sleep 15
          done
          echo "::error title=Promotion unverified::$url never reported $HEAD_SHA (last: ${body:-<none>}). The artifact bound but the running release is serving different code."
          exit 1


      # The binding record. Written AFTER verification, so the ledger records what was
      # observed serving rather than what was attempted — a binding row for a promotion
      # that never took would be worse than no row.
      - name: Record the binding
        if: success() && steps.freshness.outputs.fresh == 'true' 
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LEDGER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEDGER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: "3"
          BUCKET: ${{ inputs.ledger_bucket }}
          ENDPOINT: ${{ inputs.ledger_endpoint }}
          PREFIX: ${{ inputs.ledger_prefix }}
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::warning::Binding not recorded — no ledger credentials."; exit 0; }
          digest="$(echo '${{ inputs.image_ref }}' | grep -oE 'sha256:[0-9a-f]{64}')"
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<PY > binding.json
          import json
          print(json.dumps({
            "artifact_id": "$digest",
            "image_ref": "${{ inputs.image_ref }}",
            "env": "${{ inputs.env_name }}",
            "app": "${{ inputs.app }}",
            "source_sha": "${{ inputs.head_sha }}",
            "bound_at": "$at",
            "bound_by": "github-actions:${{ github.run_id }}",
            "intent": "promotion",
            "result": "verified",
          }, indent=2))
          PY
          # THE DECLARED SUBJECT, ADDED ONLY WHEN THE CALLER SUPPLIED ONE.
          #
          # `app` above is the Fly app name. A reader joining bindings to the fleet's
          # declaration on that name gets it wrong for any app whose platform name differs
          # -- it finds no declaration, and a careless reader turns "no declaration" into
          # "an app nobody declared" or "an app that never deployed". Both are wrong and in
          # opposite directions, from one omission.
          #
          # `subject` is the `run-record` §3 #4 form, `<type>:<name>[@<env>]`, so it carries
          # the environment axis rather than needing one bolted on later.
          #
          # Absent input means NO KEY, never an empty string and never a guess. A binding
          # that cannot say which declared subject it belongs to must not appear to say.
          if [ -n "${{ inputs.declared_app }}" ]; then
            python3 - <<'PY' > binding.json.new
          import json
          d = json.load(open("binding.json"))
          d["subject"] = "app:${{ inputs.declared_app }}@${{ inputs.env_name }}"
          print(json.dumps(d, indent=2))
          PY
            mv binding.json.new binding.json
          fi
          key="${PREFIX}bindings/${{ inputs.env_name }}/${at//:/-}-$(echo "$digest" | tr ':' '-').json"
          aws s3api --endpoint-url "$ENDPOINT" put-object --bucket "$BUCKET" --key "$key" \
            --body binding.json --content-type application/json >/dev/null
          aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null \
            || { echo "::error title=Binding not recorded::Wrote $key but it is not readable back. The app IS serving the artifact; the ledger does not know."; exit 1; }
          echo "Recorded $key"
          cat binding.json

      # Reports, never gates (observation.md #21): a defect in a readiness check must not
      # make the app undeployable, including by the deploy that would fix it.
      - name: Report readiness after binding
        if: inputs.ready_path != '' && steps.freshness.outputs.fresh == 'true' 
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.ready_path }}"
          code="000"
          for _ in $(seq 1 12); do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 10 "$url" || echo "000")
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" = "200" ]; then echo "Ready after binding."; exit 0; fi
          echo "::warning title=Not ready after promotion::$url returned $code. The artifact IS serving; the app reports it cannot do its job. Readiness does not gate, so nothing was blocked."
