# PROMOTION adapter. Binds an artifact that already exists to one environment.
#
# specs/artifact-and-promotion.md #3: a promotion MUST NOT produce an artifact — "if a
# promotion adapter can compile, fetch dependencies, or resolve a version range, it is a
# build". This one takes a digest-pinned image and calls `flyctl deploy --image`, which has
# no build path. It never checks out the source, so it structurally cannot build: the
# repository is not present in the job.
#
# That is the difference from the old fly-deploy.yml, which built and deployed in one step.
# Two builds of the same commit can differ — base image drift, apt versions — so nothing
# could honestly claim that what was verified is what shipped. Promotion by digest can.
name: Fly promote (reusable)

on:
  workflow_call:
    inputs:
      image_ref:
        description: "Digest-pinned image from the build adapter. MUST contain @sha256:."
        required: true
        type: string
      app:
        description: "Fly app to bind the artifact to. THIS names the environment."
        required: true
        type: string
      app_domain:
        required: true
        type: string
      head_sha:
        description: "Source sha the artifact was built from, asserted against /version."
        required: true
        type: string
      version_path:
        required: false
        type: string
        default: "/version"
      ready_path:
        description: "Probed after binding and REPORTED. Never gates (observation.md #21)."
        required: false
        type: string
        default: ""
      ledger_bucket:
        required: false
        type: string
        default: "cobenian-fleet-ledger"
      ledger_endpoint:
        required: false
        type: string
        default: "https://fly.storage.tigris.dev"
      ledger_prefix:
        description: "Key prefix. The bucket will hold other things; the ledger stays under one namespace."
        required: false
        type: string
        default: "ledger/"
      env_name:
        description: "Environment this binding is to. One value today; the key exists so a second costs nothing."
        required: false
        type: string
        default: "prod"
    secrets:
      FLY_API_TOKEN:
        required: true
      LEDGER_ACCESS_KEY_ID:
        required: false
      LEDGER_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote to ${{ inputs.app }}
    runs-on: ubuntu-latest
    concurrency: promote-${{ inputs.app }}
    steps:
      # No checkout. A promotion that cannot see the source cannot build from it, which is
      # #3 enforced by construction rather than by discipline.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # #14: a promotion MUST bind an artifact that already exists. A tag is not an
      # artifact — it is mutable and can be repointed between verification and promotion,
      # which is exactly the substitution this whole separation exists to prevent.
      - name: Refuse anything that is not digest-pinned
        run: |
          set -euo pipefail
          case "${{ inputs.image_ref }}" in
            *@sha256:*) echo "Promoting ${{ inputs.image_ref }}" ;;
            *) echo "::error title=Not an artifact::image_ref must be digest-pinned (…@sha256:…). A tag can be repointed after verification, so promoting one binds something nobody verified."; exit 1 ;;
          esac


      # artifact-and-promotion #14: a promotion MUST bind an artifact that already exists
      # in the ledger. This is the requirement the ledger exists to make enforceable, and
      # without it "build once, promote" is only a convention.
      #
      # Absence of credentials is NOT absence of the artifact. If the ledger cannot be
      # read, this cannot conclude the artifact is missing, so it warns and proceeds —
      # treating "could not check" as "not recorded" would block every promotion the
      # moment the ledger had a bad minute.
      - name: The artifact must already be in the ledger
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LEDGER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEDGER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: "3"
          BUCKET: ${{ inputs.ledger_bucket }}
          ENDPOINT: ${{ inputs.ledger_endpoint }}
          PREFIX: ${{ inputs.ledger_prefix }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning title=Ledger not checked::No ledger credentials, so this promotion could not confirm the artifact is recorded. Proceeding — could-not-check is not the same as not-recorded."
            exit 0
          fi
          digest="$(echo '${{ inputs.image_ref }}' | grep -oE 'sha256:[0-9a-f]{64}')"
          key="${PREFIX}artifacts/${{ github.repository }}/$(echo "$digest" | tr ':' '-').json"

          if aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "Artifact is in the ledger: $key"
            exit 0
          fi
          echo "::error title=Unrecorded artifact::$key is not in the ledger. Promoting an artifact nothing recorded means nothing can say what it was built from, whether its gate passed, or whether it is reversible."
          exit 1

      - name: Bind the artifact
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          args="--image ${{ inputs.image_ref }} -a ${{ inputs.app }} --wait-timeout 15m"
          flyctl deploy $args || {
            echo "::warning::First promotion attempt failed; retrying once."
            flyctl deploy $args
          }

      # A green promotion is not evidence the artifact is serving — the same reason
      # fly-deploy.yml asserts this. Only the app reporting its own commit closes the gap.
      - name: Verify the bound artifact is serving
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.version_path }}"
          for _ in $(seq 1 20); do
            body=$(curl -fsS "$url" 2>/dev/null || true)
            case "$body" in *"$HEAD_SHA"*) echo "Verified: $url reports $HEAD_SHA."; exit 0 ;; esac
            sleep 15
          done
          echo "::error title=Promotion unverified::$url never reported $HEAD_SHA (last: ${body:-<none>}). The artifact bound but the running release is serving different code."
          exit 1


      # The binding record. Written AFTER verification, so the ledger records what was
      # observed serving rather than what was attempted — a binding row for a promotion
      # that never took would be worse than no row.
      - name: Record the binding
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LEDGER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEDGER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: "3"
          BUCKET: ${{ inputs.ledger_bucket }}
          ENDPOINT: ${{ inputs.ledger_endpoint }}
          PREFIX: ${{ inputs.ledger_prefix }}
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::warning::Binding not recorded — no ledger credentials."; exit 0; }
          digest="$(echo '${{ inputs.image_ref }}' | grep -oE 'sha256:[0-9a-f]{64}')"
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<PY > binding.json
          import json
          print(json.dumps({
            "artifact_id": "$digest",
            "image_ref": "${{ inputs.image_ref }}",
            "env": "${{ inputs.env_name }}",
            "app": "${{ inputs.app }}",
            "source_sha": "${{ inputs.head_sha }}",
            "bound_at": "$at",
            "bound_by": "github-actions:${{ github.run_id }}",
            "intent": "promotion",
            "result": "verified",
          }, indent=2))
          PY
          key="${PREFIX}bindings/${{ inputs.env_name }}/${at//:/-}-$(echo "$digest" | tr ':' '-').json"
          aws s3api --endpoint-url "$ENDPOINT" put-object --bucket "$BUCKET" --key "$key" \
            --body binding.json --content-type application/json >/dev/null
          aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "$key" >/dev/null \
            || { echo "::error title=Binding not recorded::Wrote $key but it is not readable back. The app IS serving the artifact; the ledger does not know."; exit 1; }
          echo "Recorded $key"
          cat binding.json

      # Reports, never gates (observation.md #21): a defect in a readiness check must not
      # make the app undeployable, including by the deploy that would fix it.
      - name: Report readiness after binding
        if: inputs.ready_path != ''
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.ready_path }}"
          code="000"
          for _ in $(seq 1 12); do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 10 "$url" || echo "000")
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" = "200" ]; then echo "Ready after binding."; exit 0; fi
          echo "::warning title=Not ready after promotion::$url returned $code. The artifact IS serving; the app reports it cannot do its job. Readiness does not gate, so nothing was blocked."
