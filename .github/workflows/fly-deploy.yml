# REUSABLE Fly deploy (workflow_call). Consumers reference this by tag:
#   uses: Cobenian/.github/.github/workflows/fly-deploy.yml@v1
#
# The triggering `workflow_run` event + main-branch gate stay in each repo's
# thin caller (a repo can't define another repo's trigger); only the deploy
# steps live here, so deploy hardening is a one-edit change for every consumer.
# See STANDARDS.md §4.
name: Fly Deploy (reusable)

on:
  workflow_call:
    inputs:
      head_sha:
        description: "Exact commit SHA that CI validated — the deploy checks this out."
        required: true
        type: string
      app_domain:
        description: "Host for the post-deploy smoke test, e.g. accounts.cobenian.com."
        required: true
        type: string
      health_path:
        description: "Liveness path to curl after deploy."
        required: false
        type: string
        default: "/health"
      ready_path:
        description: >-
          Optional readiness path (e.g. /readyz). Probed AFTER binding and REPORTED, never
          gated — see the "Report readiness after binding" step. Skipped when empty.
        required: false
        type: string
        default: ""
      uses_hex_org_key:
        description: "Pass the private Cobenian Hex org key as a BuildKit build secret."
        required: false
        type: boolean
        default: false
      version_path:
        description: >-
          Optional path returning the running commit SHA (e.g. /version). When set, the deploy
          asserts the live app reports `head_sha` — the only check that proves the intended code
          is actually serving. Skipped when empty.
        required: false
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN:
        required: true
      HEX_ORG_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # Serialize deploys per consumer repo so two in-flight deploys can't interleave. Queued
    # rather than cancelled: cancelling mid-`flyctl deploy` can leave a rollout half-applied,
    # and the freshness re-check below already prevents a queued-but-stale deploy from landing.
    concurrency: deploy-group
    steps:
      # ── Freshness gate (the stale-deploy fix) ────────────────────────────────
      #
      # CD is `workflow_run`-triggered off CI completion, and CI runs take minutes. When two
      # merges land close together, the OLDER commit's CI can finish AFTER the newer merge —
      # firing a deploy that ships the older code over the newer, with a green check.
      #
      # Observed 2026-08-02 in cobenian-panel: PR #184 merged at 14:44; PR #183's CI finished at
      # 14:45:28 and deployed its own (older) SHA. The run reported success and GitHub's run list
      # labelled it with the NEWER sha, so nothing surfaced the regression — prod silently served
      # the previous commit until the newer commit's own CI completed four minutes later.
      #
      # So: refuse to deploy anything that is no longer the tip of the default branch. This runs
      # AFTER the concurrency slot is acquired, so a deploy that went stale while queued behind a
      # newer one is caught here rather than overwriting it. `github.repository` inside a reusable
      # workflow is the CALLER's repo, which is what we want.
      #
      # Skipping is always safe: whatever is now the tip has (or will have) its own CI + deploy.
      - name: Check the commit is still the tip of the default branch
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/$REPO" --jq .default_branch)
          tip=$(gh api "repos/$REPO/commits/$branch" --jq .sha)

          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Deploying $HEAD_SHA (tip of $branch)."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped (superseded)::\
          $HEAD_SHA is no longer the tip of $branch (now $tip). Skipping to avoid deploying \
          older code over newer. The tip commit deploys from its own CI run."
          fi

      - uses: actions/checkout@v7
        if: steps.freshness.outputs.fresh == 'true'
        with:
          ref: ${{ inputs.head_sha }} # deploy the exact validated SHA
      # Pinned to a SHA, not `@master`. This step installs the binary that then
      # runs with FLY_API_TOKEN against production, so a floating branch ref means
      # any push to a third-party repo lands in every fleet deploy with no review.
      # This SHA is what `@master` already resolved to, and is simultaneously the
      # `v1` and `1.6` tags, so this is a hardening with no behaviour change.
      # Dependabot keeps it current now that this repo is watched.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.freshness.outputs.fresh == 'true'
      # Retry once on a transient failure: the dominant flake is the Fly
      # `release_command` machine failing/hanging on cold start (host scheduling
      # or a Postgres cold-connect), which a plain re-run clears. Safe because
      # the release command is idempotent (already-applied migrations skip).
      # `--wait-timeout 15m` rides out a slow cold start instead of tripping
      # flyctl's default 5m machine-state timeout.
      - name: Deploy
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          # GIT_SHA build-arg stamps the deployed commit into logs (Core Platform C7 `commit` field).
          # Backward-compatible: a Dockerfile without `ARG GIT_SHA` just ignores it (BuildKit warning).
          args="--remote-only --wait-timeout 15m --build-arg GIT_SHA=${{ inputs.head_sha }}"
          if [ "${{ inputs.uses_hex_org_key }}" = "true" ]; then
            args="$args --build-secret hex_org_key=$HEX_ORG_KEY"
          fi
          flyctl deploy $args || {
            echo "::warning::First deploy attempt failed (transient Fly release-machine flake); retrying once."
            flyctl deploy $args
          }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEX_ORG_KEY: ${{ secrets.HEX_ORG_KEY }}
      - name: Smoke test
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          sleep 15
          # Liveness only. Readiness deliberately does NOT gate — it is probed and reported
          # after verification instead (specs/observation.md #21).
          curl -fsS "https://${{ inputs.app_domain }}${{ inputs.health_path }}" > /dev/null

      # ── Prove the intended code is actually serving ──────────────────────────
      #
      # A green deploy is not evidence the change shipped. Neither is the Fly image label: it is
      # set from the workflow input while the build uses the checkout, so the two can disagree —
      # in the 2026-08-02 incident the label said the new sha and the running code was the old one.
      # Only the app reporting its own commit closes that gap. Opt-in per consumer via
      # `version_path`; consumers that expose no such endpoint keep the previous behavior.
      - name: Verify the running release reports the deployed SHA
        if: steps.freshness.outputs.fresh == 'true' && inputs.version_path != ''
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.version_path }}"

          # Machines roll one at a time, so poll rather than sampling once.
          for attempt in $(seq 1 20); do
            body=$(curl -fsS "$url" 2>/dev/null || true)
            case "$body" in
              *"$HEAD_SHA"*)
                echo "Verified: $url reports $HEAD_SHA."
                exit 0 ;;
            esac
            sleep 15
          done

          echo "::error title=Deploy verification failed::\
          $url never reported $HEAD_SHA (last response: ${body:-<none>}). The deploy reported \
          success but the running release is serving different code — do not trust this deploy."
          exit 1

      # ── Post-binding readiness report (never a gate) ──────────────────────────
      #
      # `specs/observation.md` #21 forbids gating a deploy on /readyz, and is right for a
      # reason worth restating where someone may be tempted to "improve" this: if readiness
      # gates deploys, a defect in a readiness check makes the app undeployable — INCLUDING
      # the deploy that would fix that defect. A gate must not be able to lock out its own
      # repair. Until now `ready_path` was curled with `-fsS` inside the smoke test, so it
      # did gate; cobenian_companion_umbrella passes it, and once its /readyz began checking
      # vaults and migrations a single unkeyed vault would have blocked every deploy.
      #
      # It runs at all because `specs/change-and-recovery.md` #16 requires the window
      # immediately after a binding to be checked then, not at the next scheduled tick —
      # otherwise the hourly external probe leaves up to an hour in which a deploy that
      # stalled a queue looks entirely successful.
      #
      # Only the app's own checks can appear here: /readyz already refuses to let a failing
      # dependency move its status code.
      - name: Report readiness after binding
        if: steps.freshness.outputs.fresh == 'true' && inputs.ready_path != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          url="https://${{ inputs.app_domain }}${{ inputs.ready_path }}"

          # Machines roll one at a time, so a 503 mid-roll is expected. Poll for a settled
          # answer rather than judging the first one.
          code="000"
          for _ in $(seq 1 12); do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 10 "$url" || echo "000")
            [ "$code" = "200" ] && break
            sleep 10
          done

          if [ "$code" = "200" ]; then
            echo "Readiness after binding: ready ($url)."
            exit 0
          fi

          # A body without `checks` is not a readiness report (observation.md #16) — a
          # catch-all 200 or an error page must never read as healthy.
          failing=$(python3 -c "
          import json
          try:
              c = (json.load(open('body.json')) or {}).get('checks') or {}
              bad = sorted(k.replace(':status','') for k, v in c.items()
                           if (v[0] if isinstance(v, list) and v else {}).get('status') == 'fail')
              print(', '.join(bad) or 'no failing check named')
          except Exception:
              print('no readiness report returned')
          " 2>/dev/null || echo unreadable)

          echo "::warning title=Not ready after deploy::$url returned $code after binding (failing: $failing). The intended code IS serving; the app reports it cannot do its job. Readiness does not gate deploys, so nothing was blocked — act on this directly."

          TITLE="🚨 Not ready after deploy: $REPO"
          # Best effort: a caller that has not granted `issues: write` still gets the
          # annotation above, and the hourly external probe still catches it.
          NUM=$(gh issue list --state open --search "$TITLE" --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" 2>/dev/null || true)
          printf '%s\n' \
            "Readiness returned \`$code\` after deploying \`$HEAD_SHA\`." \
            "" \
            "Failing checks: \`$failing\`" \
            "" \
            "The deploy verified — the intended code is serving. The app is reporting that it" \
            "cannot do its job. Readiness deliberately does not gate deploys, so nothing was" \
            "blocked and nothing was rolled back." \
            "" \
            "$RUN_URL" > issue.md
          if [ -n "${NUM:-}" ]; then
            gh issue comment "$NUM" --body-file issue.md 2>/dev/null || true
          else
            gh issue create --title "$TITLE" --body-file issue.md 2>/dev/null || true
          fi
