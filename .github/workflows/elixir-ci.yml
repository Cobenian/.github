# REUSABLE CI workflow — canonical for all Cobenian repos.
#
# DESTINATION: Cobenian/.github repo at .github/workflows/elixir-ci.yml
# Consumed by each repo's thin .github/workflows/ci.yml via:
#   uses: Cobenian/.github/.github/workflows/elixir-ci.yml@v1
#
# Staged here under org-github-repo/.github/workflows/ (mirrors the real path) for
# review; it is NOT under THIS repo's .github/, so GitHub won't run it here.
#
# Merged from the cobenian-cadence and cobenian-accounts sessions. Implements
# STANDARDS.md §3 (CI) with the §10 `nonblocking` ratchet.
name: Elixir CI (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "app | library (required — forces an explicit choice)"
        type: string
        required: true
      umbrella:
        description: "true for umbrella apps (e.g. Companion)"
        type: boolean
        default: false
      postgres:
        description: "start a Postgres service + run ecto setup"
        type: boolean
        default: true
      nonblocking:
        description: >-
          Comma-separated checks to run report-only (continue-on-error) during a
          repo's cleanup ramp. Recognized: credo, sobelow, hex_audit, deps_audit.
          (Dialyzer is governed separately by `dialyzer_blocking`.)
        type: string
        default: ""
      dialyzer_blocking:
        description: "promote Dialyzer from report-only to blocking once PLTs are stable"
        type: boolean
        default: false
      sobelow_root:
        description: "Phoenix app root for Sobelow ('.' or 'apps/<web_app>' for umbrellas)"
        type: string
        default: "."
      migrations_path:
        description: "path to migrations for the duplicate-timestamp check"
        type: string
        default: "priv/repo/migrations"
      elixir-version:
        type: string
        default: "1.20.3"
      otp-version:
        type: string
        default: "29.0.5"
      postgres_image:
        type: string
        default: "postgres:17"
      gitleaks_version:
        type: string
        default: "8.21.2"
      audit_ignore_max_days:
        description: >-
          Furthest an .audit-ignore.yml entry may expire from today, in days. An entry
          further out fails the build. Capped at 365 whatever is passed. See STANDARDS.md §5.1.
        type: number
        default: 90

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      db:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # Apps with hand-written migrations: fail fast on duplicate timestamps
      # (two PRs merged the same day can collide; only breaks once both land on main).
      - name: Check for duplicate migration versions
        if: ${{ inputs.profile == 'app' }}
        run: |
          dir="${{ inputs.migrations_path }}"
          [ -d "$dir" ] || { echo "No migrations dir ($dir) — skipping."; exit 0; }
          dupes=$(ls "$dir" | grep -E '^[0-9]+_' | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version(s): $dupes"; exit 1
          fi
          echo "No duplicate migration versions."

      # Fly clustering: an app running DNSCluster MUST name its node by a STABLE basename
      # (the release name), or its machines never cluster and LiveView reconnect-loops the
      # moment a 2nd machine autostarts. This was a silent, fleet-wide gap (DNSCluster
      # present, node-naming missing or keyed on the per-deploy image ref). Catch it here
      # instead of in prod. See STANDARDS.md §4 + templates/rel-env.sh.eex.
      - name: Fly clustering config (rel/env.sh.eex)
        if: ${{ inputs.profile == 'app' }}
        run: |
          if [ -z "$(grep -rl 'DNSCluster' apps lib 2>/dev/null | head -1)" ]; then
            echo "No DNSCluster — clustering config not required."; exit 0
          fi
          if [ ! -f rel/env.sh.eex ]; then
            echo "::error::App uses DNSCluster but rel/env.sh.eex is missing — its Fly machines won't cluster (LiveView reconnect-loops on >1 machine). Copy Cobenian/.github templates/rel-env.sh.eex. See STANDARDS.md §4."
            exit 1
          fi
          if grep -q 'FLY_IMAGE_REF' rel/env.sh.eex; then
            echo "::error::rel/env.sh.eex keys the node name on FLY_IMAGE_REF — that changes every deploy, so the machines never match and Node.list() stays empty. Name the node by the release name (<%= @release.name %>)."
            exit 1
          fi
          grep -q 'RELEASE_NODE' rel/env.sh.eex || { echo "::error::rel/env.sh.eex does not set RELEASE_NODE."; exit 1; }
          echo "Clustering config present with a stable node basename."

      # Log attribution: a spawned Task/process does NOT inherit the caller's Logger metadata,
      # so one that logs inside an attributed request/job produces unattributed lines. The fleet
      # UnattributedSpawn credo check (shipped in cobenian_core_platform) catches that — but only
      # if it's enabled AND actually loaded. It ships behind `if Code.ensure_loaded?(Credo.Check)`
      # and credo isn't on the dep's compile path, so a `.credo.exs` `requires:` entry is needed
      # or credo silently "Ignores an undefined check" and the guard is inert. Assert both here so
      # a new app can't forget it. See STANDARDS.md §3 + templates/credo.exs.
      - name: Log-attribution guard (.credo.exs UnattributedSpawn)
        if: ${{ inputs.profile == 'app' }}
        run: |
          if ! grep -rlq --include=mix.exs 'cobenian_core_platform' . 2>/dev/null; then
            echo "App does not depend on cobenian_core_platform — spawn-attribution guard not applicable."; exit 0
          fi
          [ -f .credo.exs ] || { echo "::error::.credo.exs is missing — can't enable the UnattributedSpawn log-attribution guard. Run 'mix credo.gen.config' and start from Cobenian/.github templates/credo.exs. See STANDARDS.md §3."; exit 1; }
          if ! grep -q 'Cobenian.CorePlatform.Logging.Credo.UnattributedSpawn' .credo.exs; then
            echo "::error::.credo.exs does not enable the UnattributedSpawn guard — a spawned Task/process that logs would go unattributed. Add {Cobenian.CorePlatform.Logging.Credo.UnattributedSpawn, []} to checks.enabled (see templates/credo.exs). STANDARDS.md §3."
            exit 1
          fi
          if ! grep -q 'core_platform/logging/credo' .credo.exs; then
            echo "::error::.credo.exs enables UnattributedSpawn but never loads it via requires: — credo silently ignores it and the guard is inert. Add the dep source to requires: (deps/cobenian_core_platform/lib/cobenian/core_platform/logging/credo/unattributed_spawn.ex). See templates/credo.exs + STANDARDS.md §3."
            exit 1
          fi
          echo "UnattributedSpawn log-attribution guard enabled and loaded."

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-mix-

      # Authenticate to a private Cobenian Hex organization when a key is provided
      # (repos with private Hex deps set the HEX_ORG_KEY secret; others no-op). Must
      # run before deps.get so private packages resolve.
      #
      # Hex >= 2.5.0 prints "Authenticating to the cobenian repository with a stored
      # key is deprecated and will be removed" on every deps.get/hex.audit here. DO NOT
      # "fix" it by rotating HEX_ORG_KEY or by re-running the command the warning
      # suggests — the warning's own CI advice IS this line, and following it changes
      # nothing. Verified against the Hex 2.5.1 source:
      #
      #   * Hex.Repo.build_hex_core_config/3 (lib/hex/repo.ex:325) warns whenever
      #     repo_config.auth_key is non-nil for a `hexpm:<org>` repo. That is the whole
      #     trigger — the key's type, age and permissions are never inspected.
      #   * `mix hex.organization auth --key` reaches Mix.Tasks.Hex.auth_organization/2
      #     (lib/mix/tasks/hex.ex:280), which stores the key as auth_key. So the advised
      #     command reproduces the exact state that emits the warning.
      #   * The only alternative, HEX_REPOS_KEY, trips the sibling :env branch
      #     (repo.ex:378) — a different sentence, equally deprecated.
      #   * The non-deprecated path is OAuth, but Hex.State's :oauth_token has no env
      #     var (lib/hex/state.ex:18) — it is written only by `mix hex.user auth`'s
      #     interactive device flow. There is no CI OAuth path in 2.5.1.
      #
      # Upstream owns this and has already fixed it: hexpm/hex#1207 (merged 2026-07-21,
      # NOT in 2.5.1) records key ownership so organization-owned keys stop warning.
      # hexpm/hex#1181 is the eventual breaking change, and it deliberately PRESERVES
      # this command — it only changes what Hex stores (the key is exchanged for a
      # short-lived token). So this line is already the forward-compatible form and
      # needs no change; do not pin Hex to hold the warning still, that blocks the fix.
      #
      # Two things that DO need care before Hex 2.6 — see the tracking issue:
      #   1. Per #1207, user-owned keys stop working in 2.6 while organization-owned
      #      keys keep working. Whether HEX_ORG_KEY survives depends on which it is
      #      (`mix hex.organization key cobenian list` — org-owned keys appear there).
      #      A key minted before 2.4.2 via `auth` without --key is likely user-owned.
      #   2. The 2.6 token is short-lived (~30 min, no refresh), so auth must run
      #      immediately before the fetch. It does here. Product Dockerfiles that
      #      consume the fly-deploy.yml hex_org_key build-secret need the same check.
      - name: Authenticate private Hex organizations
        env:
          HEX_ORG_KEY: ${{ secrets.HEX_ORG_KEY }}
          HEX_FLEET_KEY: ${{ secrets.HEX_FLEET_KEY }}
        run: |
          if [ -n "$HEX_ORG_KEY" ]; then
            mix hex.organization auth cobenian --key "$HEX_ORG_KEY"
          fi
          # A SECOND ORGANISATION, WITH ITS OWN KEY. `fleet` holds libraries shared
          # across fleets that do not trust each other -- fleet_auth first. A Hex
          # organisation key grants read to EVERY package in its organisation and cannot
          # be scoped to one, so reusing HEX_ORG_KEY here would hand every repo holding
          # it a key for the other organisation, which is exactly what the separate
          # organisation was created to prevent. Hence a distinct secret name.
          #
          # KEYED ON PRESENCE, and presence is not opt-in. An earlier draft of this
          # comment said "a repo opts in by having the secret". That was false by the
          # time it was written: both organisation secrets are `visibility=private`,
          # which grants them to EVERY private repository in the organisation. So this
          # runs in all ~40 repos, not the handful that use `fleet`.
          #
          # Recorded rather than quietly corrected, because a comment describing a model
          # nobody implemented is the exact thing this estate keeps paying to remove --
          # the next person reads the intent and trusts a scoping that does not exist.
          #
          # Harmless as it stands: authenticating an organisation a repo never fetches
          # from costs one command. If real opt-in is ever wanted, it is a change to the
          # SECRET's visibility (selected repositories), not to this file.
          #
          # And note the failure shape of keying on presence: a repo that SHOULD have the
          # key and does not skips this silently and fails later at `mix deps.get`, with
          # an error naming a package rather than a credential. Left deliberately -- CI
          # goes red either way, so it is loud -- but it is a wrong-diagnosis-shaped error
          # and worth knowing before someone debugs the package.
          if [ -n "$HEX_FLEET_KEY" ]; then
            mix hex.organization auth fleet --key "$HEX_FLEET_KEY"
          fi

      # AN ID, SO THE POSTURE STEP CAN ASK. Every Mix-based scanner below needs the
      # dependency tree; when this step fails they cannot answer, and several of them
      # say so by exiting 0 with nothing to report -- which is indistinguishable from a
      # clean result. `steps.deps.outcome` is the one honest signal that they could not
      # have looked.
      - name: deps.get
        id: deps
        run: mix deps.get

      # --- blocking hygiene + correctness (check variants — never auto-fix) ---
      - name: deps.unlock --check-unused
        run: mix deps.unlock --check-unused
      - name: format --check-formatted
        run: mix format --check-formatted
      # `_build` is restored from a cache keyed on mix.lock, so it routinely crosses
      # commits that change SOURCE without changing the lock. Compiling incrementally
      # on top of those stale artifacts makes `--warnings-as-errors` non-deterministic
      # in BOTH directions, and we have now been bitten both ways:
      #
      #   * False RED — cobenian-foundry 3f3bce1 (2026-08-21) failed here with
      #     "incompatible types" against a struct that #491 had just gained a field on.
      #     A re-run of the identical SHA passed, and a clean local build on the same
      #     Elixir 1.20.3 produced ZERO warnings. The code was never wrong; the
      #     restored `_build` was.
      #   * False GREEN — the same mechanism can leave a caller's artifacts stale and
      #     never re-check it, so a genuine warning is simply not emitted. That is the
      #     dangerous direction, and it is silent.
      #
      # `mix clean` drops only THIS project's artifacts and leaves compiled
      # dependencies in `_build` untouched, so every run type-checks all first-party
      # code from scratch while keeping the expensive part of the cache. Measured on
      # cobenian-foundry (21 umbrella apps, the fleet's largest): 8s, with zero
      # dependency recompiles.
      - name: clean first-party build artifacts (keep compiled deps)
        run: mix clean
      - name: compile --warnings-as-errors
        run: mix compile --warnings-as-errors

      # --- quality + security (ratchetable via `nonblocking`) ---
      - name: credo --strict
        run: mix credo --strict
        continue-on-error: ${{ contains(inputs.nonblocking, 'credo') }}

      # `--skip` honours `@sobelow_skip ["Check.Name"]` on a function. Without it the
      # annotation is silently inert, so a verified false positive has no way to be recorded
      # in the code next to the mitigation that makes it false — the only alternatives being
      # a repo-wide ignore list (too blunt: it hides genuine future findings of that check)
      # or leaving sobelow non-blocking forever. Suppression stays per-function and reviewable
      # in the diff.
      - name: sobelow (apps only)
        if: ${{ inputs.profile == 'app' }}
        run: mix sobelow --exit --skip --root ${{ inputs.sobelow_root }}
        continue-on-error: ${{ contains(inputs.nonblocking, 'sobelow') }}

      # --- DB + tests ---
      - name: Set up test database
        if: ${{ inputs.postgres }}
        run: mix ecto.create --quiet && mix ecto.migrate --quiet
      - name: test
        run: mix test

      # --- Dialyzer (report-only until dialyzer_blocking: true) ---
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-plt-v2-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-plt-v2-
      # Report-only mode must NOT stamp the run with the runner's
      # "##[error]Process completed with exit code N". `continue-on-error` sets the step
      # *conclusion* to success but the runner still emits that error annotation, so an
      # advisory Dialyzer report is indistinguishable from a real gate failure in the run
      # summary — which trains everyone to ignore the annotations panel. (Observed on
      # cobenian-panel CI #1647, 2026-08-27: green run, red X, 237 findings nobody read.)
      #
      # So handle dialyxir's exit code here instead of delegating to continue-on-error:
      #   0 -> clean.
      #   2 -> findings. Already surfaced individually as ::warning:: annotations by
      #        --format github. Advisory unless dialyzer_blocking.
      #   * -> Dialyzer could not complete: PLT build failure, a crash, or a stale entry
      #        in .dialyzer_ignore.exs that no longer matches (exit 1, via
      #        list_unused_filters). ALWAYS fails, even report-only — "the tool did not
      #        run" must never be allowed to read as "the tool found nothing".
      - name: Dialyzer
        env:
          DIALYZER_BLOCKING: ${{ inputs.dialyzer_blocking }}
        run: |
          set +e
          mix dialyzer --format github
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Dialyzer: no findings."
              ;;
            2)
              if [ "$DIALYZER_BLOCKING" = "true" ]; then
                echo "::error title=Dialyzer::Dialyzer reported findings and this repo sets dialyzer_blocking: true. See the warning annotations on this run."
                exit 1
              fi
              echo "::warning title=Dialyzer (report-only)::Dialyzer reported findings. NOT failing the build: this repo sets dialyzer_blocking: false. See the warning annotations on this run."
              ;;
            *)
              echo "::error title=Dialyzer::Dialyzer could not complete (exit ${rc}) — a tool/PLT/ignore-filter failure, not a findings report. This fails the build regardless of dialyzer_blocking."
              exit "$rc"
              ;;
          esac

      # --- secret scanning (replaces GHAS; runs on all repos) ---
      # gitleaks CLI binary, NOT gitleaks-action@v2 — the action requires a paid
      # license for organization accounts (Cobenian is an org); the binary is free.
      # Pin the version and bump deliberately. See STANDARDS.md §5.
      # Cache the pinned gitleaks binary across runs, keyed on its version. On a hit
      # the binary is restored to ./gitleaks and NO network fetch happens — the fewer
      # times we hit the GitHub release CDN, the fewer chances a transient 5xx blip
      # (as happened 2026-07-24) can touch the build. Both this blocking step and the
      # non-blocking scan-posture step below reuse the same ./gitleaks.
      # --- secret scan: RUNS EVEN IF AN EARLIER GATE FAILED ---
      # Whether this commit leaks a credential is not contingent on whether it compiles,
      # passes credo, or types cleanly. Before this, `credo --strict` failing skipped the
      # secret scan outright -- "we did not look for secrets because the formatting was
      # wrong" -- and every consumer passes `nonblocking: ""`, so that guard was live in
      # all of them. #53 stopped the dependency audits from skipping this step; these two
      # `if:`s stop EVERYTHING ELSE from skipping it.
      #
      # `success() || failure()` rather than `always()`: always() also runs on a CANCELLED
      # job, where the runner is being torn down and a scan result is meaningless.
      #
      # This step needs only the checkout and its own binary -- no Elixir, no deps, no
      # compiled code -- so there is no earlier failure that makes running it incoherent.
      # It STILL FAILS THE BUILD on a finding: `--exit-code 1` is untouched. Not skippable
      # is not the same as not blocking.
      - name: Cache gitleaks binary
        if: ${{ success() || failure() }}
        uses: actions/cache@v6
        with:
          path: ./gitleaks
          key: gitleaks-${{ runner.os }}-${{ inputs.gitleaks_version }}

      - name: gitleaks (secret scan)
        if: ${{ success() || failure() }}
        run: |
          v="${{ inputs.gitleaks_version }}"
          # Fetch the binary resiliently: a transient release-CDN 5xx (e.g. a 504) must
          # NOT hard-fail CI — only real secret findings may. curl retries transient
          # errors itself; the outer loop also covers a truncated tar extraction, and a
          # clean ::error:: is emitted only if every attempt is exhausted. Separate the
          # download from the extract (temp file, not a `curl | tar` pipe) so a partial
          # body is never streamed into tar. Skipped entirely on a cache hit.
          if [ ! -x ./gitleaks ]; then
            url="https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
            for attempt in 1 2 3; do
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
                   -o gitleaks.tar.gz "$url" \
                 && tar -xzf gitleaks.tar.gz gitleaks; then
                break
              fi
              echo "gitleaks fetch attempt ${attempt}/3 failed" >&2
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            rm -f gitleaks.tar.gz
          fi
          [ -x ./gitleaks ] || { echo "::error::Could not fetch gitleaks v${v} after 3 attempts (transient download failure — not a secret finding)"; exit 1; }
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      # --- dependency advisories: LAST, deliberately ---
      # These ran here-ward of `test` until 2026-09-04, and the position was the bug.
      # A blocking step that fails skips every step after it, so a newly-published
      # advisory against an untouched dependency skipped deps.audit, the test database,
      # test, Dialyzer and gitleaks. Steward's main sat green-adjacent for hours that way:
      # red for something that reads as "bump a dependency", while nothing recorded that
      # its tests and secret scan had not run. The bump then made it green and the gap
      # vanished with it.
      #
      # NOT fixed by `nonblocking`. Every consumer passes `nonblocking: ""` deliberately
      # -- the comments there say "greenfield -> fully strict" -- so they asked for
      # blocking advisory gates and should keep them. The defect is position, not
      # strictness, and it would still bite for whatever a repo left blocking. So these
      # stay blocking and move last: an advisory failure can no longer skip a
      # verification gate, and both still gate.
      #
      # WHY THESE TWO AND NOT credo/sobelow: those fail on THIS commit's code, so
      # stopping the build is the correct response to them. hex.audit and deps.audit fail
      # on facts about the outside world -- someone published an advisory -- which says
      # nothing about whether this commit's code works, and must not stop us finding out.
      #
      # That principle covers `test` and `Dialyzer`, and it does NOT cover the secret
      # scan: credo failing is not a reason to stop asking whether a credential was
      # committed. gitleaks is therefore exempt from ALL of this ordering, by its own
      # `if:` above, rather than by being placed late.
      # --- advisory ignore list: acknowledged, assessed, and EXPIRING ---
      # A published advisory against a dependency we use in a way it does not affect, with
      # no fixed release to move to, blocks every PR in the repo until upstream ships --
      # cobenian-panel on 2026-10-10, two Cloak advisories, nothing to upgrade to. The two
      # bad answers are making the audit report-only (which hides the NEXT advisory too) and
      # an open-ended ignore (which nobody revisits). This is the third answer:
      # `.audit-ignore.yml` at the repo root names ONE advisory per entry, says why it does
      # not affect THIS repo, and expires -- and an expired entry fails the build, so the
      # acknowledgement cannot quietly outlive the assessment behind it.
      #
      #   advisories:
      #     - id: EEF-CVE-2026-95105        # exact id; no wildcards, one per entry
      #       package: cloak
      #       reason: "Uses only Cloak.Ciphers.AES.GCM (authenticated); no fixed release"
      #       expires: 2027-01-08           # <= audit_ignore_max_days (default 90) out
      #       added_by: Bryan Weber
      #
      # THE TOOLS DO THE IGNORING, not a parser of their output. Hex >= 2.5.1 reads
      # HEX_IGNORE_ADVISORIES (matched on an advisory's id OR any alias, so a CVE id works
      # for an EEF/GHSA advisory) and mix_audit takes --ignore-advisory-ids. This step only
      # decides WHICH ids may be passed, so a parse that went wrong can only fail to ignore
      # something -- the build goes red, never green. On Hex < 2.5.1 the variable is unknown
      # and nothing is ignored, which is the same fail-closed direction.
      #
      # RETIREMENTS ARE NOT IGNORABLE here: HEX_IGNORE_RETIREMENTS is never set and is
      # unset in the gate. And `hex: [ignore_advisories: / ignore_retirements:]` in mix.exs
      # is refused below, because Hex honours it with no expiry and no reason -- it would
      # be an unexpiring side door around everything this step enforces.
      #
      # Fails on: an expired entry; a missing/invalid field; an expiry beyond the cap; a
      # wildcard or list in `id`; a duplicate id; an unknown key (a typo like `expire:`
      # must not read as "no expiry"). A stale entry -- one no tool reports any more --
      # only WARNS, in the step after the gates.
      - name: Advisory ignore list (.audit-ignore.yml)
        id: audit_ignores
        env:
          MAX_DAYS: ${{ inputs.audit_ignore_max_days }}
        run: |
          set -euo pipefail
          FILE=.audit-ignore.yml
          # Self-test seam: pins "today" so expiry can be tested. Nothing in a caller's
          # workflow can set a step's env, so it is not a way to defer an expiry.
          TODAY="${AUDIT_IGNORE_TODAY:-$(date -u +%F)}"

          # The side door. Any mix.exs, so an umbrella app's cannot hide one either.
          side=$( (git ls-files -- 'mix.exs' '*/mix.exs' 2>/dev/null || true) \
                  | xargs -r grep -nwE 'ignore_(advisories|retirements)' 2>/dev/null || true)
          if [ -n "$side" ]; then
            echo "$side"
            echo "::error title=Advisory ignore list::mix.exs sets hex ignore_advisories/ignore_retirements. Hex honours those with no expiry and no reason, so they bypass .audit-ignore.yml. Move advisories to .audit-ignore.yml (with a reason and an expiry); retired packages are not ignorable — replace the package. See STANDARDS.md §5.1."
            exit 1
          fi

          if [ ! -e "$FILE" ]; then
            echo "No $FILE — no advisories acknowledged; every advisory blocks."
            echo "ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$MAX_DAYS" in
            ''|*[!0-9]*) ok=no ;;
            *) if [ "$MAX_DAYS" -ge 1 ] && [ "$MAX_DAYS" -le 365 ]; then ok=yes; else ok=no; fi ;;
          esac
          if [ "$ok" = no ]; then
            echo "::error title=Advisory ignore list::audit_ignore_max_days must be a whole number from 1 to 365 (got '$MAX_DAYS')."
            exit 1
          fi

          command -v yq >/dev/null || { echo "::error title=Advisory ignore list::yq is not installed on this runner, so $FILE cannot be read. Nothing is ignored; failing rather than guessing."; exit 1; }
          json=$(yq -o=json '.' "$FILE") || { echo "::error title=Advisory ignore list::$FILE is not valid YAML."; exit 1; }

          # One jq program, emitting "error<TAB>msg", "notice<TAB>msg", "warning<TAB>msg"
          # and "id<TAB>id" lines. Dates round-trip through strptime/strftime so 2027-02-30
          # is rejected rather than normalised into March.
          result=$(jq -r --arg today "$TODAY" --argjson max "$MAX_DAYS" '
            def day: strptime("%Y-%m-%d") | mktime | . / 86400 | floor;
            def valid_date: test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
              and ((try (strptime("%Y-%m-%d") | mktime | strftime("%Y-%m-%d")) catch "") == .);
            ($today | day) as $t
            | if type != "object" or ((.advisories // null) | type) != "array"
                or (keys - ["advisories"]) != []
              then "error\tthe file must be a mapping with exactly one key, `advisories:`, holding a list"
              else
                .advisories as $all
                | ($all | map(.id? | strings | ascii_downcase)) as $ids
                | $all | to_entries[] | .key as $i | .value as $e
                | ("entry \($i + 1)" + (if ($e | type) == "object" and ($e.id | type) == "string" then " (\($e.id))" else "" end)) as $who
                | if ($e | type) != "object" then "error\t\($who): must be a mapping"
                  else
                    ([ ($e | keys - ["id","package","reason","expires","added_by"])[]
                         | "error\t\($who): unknown key `\(.)` — allowed: id, package, reason, expires, added_by" ]
                     + [ ("id","package","reason","expires","added_by") as $k
                         | select(($e[$k] | type) != "string" or ($e[$k] | test("^\\s*$")))
                         | "error\t\($who): `\($k)` is missing or empty" ]
                     + (if ($e.id | type) == "string" and ($e.id | test("^[A-Za-z0-9][A-Za-z0-9._:-]*$") | not)
                        then ["error\t\($who): `id` must be ONE exact advisory id (letters, digits, . _ : -); no wildcards, spaces or lists"]
                        else [] end)
                     + (if ($e.id | type) == "string" and ([$ids[] | select(. == ($e.id | ascii_downcase))] | length) > 1
                        then ["error\t\($who): duplicate id"] else [] end)
                     + (if ($e.reason | type) == "string" and ($e.reason | length) < 20
                        then ["error\t\($who): `reason` must say how THIS repo uses the package and why the advisory does not apply (20+ characters)"]
                        else [] end)
                     + (if ($e.expires | type) != "string" then []
                        elif ($e.expires | valid_date | not)
                        then ["error\t\($who): `expires` must be a real date written YYYY-MM-DD (got \($e.expires))"]
                        else (($e.expires | day) - $t) as $left
                          | if $left < 0
                            then ["error\t\($who): EXPIRED on \($e.expires). Re-assess it: upgrade \($e.package // "the package") if a fixed release exists, or re-justify with a new reason and date, or remove the entry."]
                            elif $left > $max
                            then ["error\t\($who): expires \($e.expires), \($left) days out — more than the \($max)-day limit. Pick a date no later than \(($t + $max) * 86400 | strftime("%Y-%m-%d"))."]
                            elif $left <= 14
                            then ["warning\t\($who): expires \($e.expires) (\($left) days) — re-assess before then or the build fails"]
                            else ["notice\t\($who) [\($e.package)]: acknowledged until \($e.expires) by \($e.added_by) — \($e.reason)"]
                            end
                        end)
                    ) as $msgs
                    # One message per line: a multi-line reason must not become a second
                    # line the runner reads as its own workflow command.
                    | ($msgs | map(gsub("[\r\n]+"; " "))) as $msgs
                    | if ($msgs | map(select(startswith("error"))) | length) > 0 then $msgs[]
                      else ($msgs[], "id\t\($e.id)") end
                  end
              end
          ' <<<"$json") || { echo "::error title=Advisory ignore list::could not evaluate $FILE."; exit 1; }

          errors=0; ids=()
          while IFS=$'\t' read -r kind msg; do
            case "$kind" in
              error)   echo "::error title=Advisory ignore list::$FILE: $msg"; errors=$((errors+1)) ;;
              warning) echo "::warning title=Advisory ignore list::$FILE: $msg" ;;
              notice)  echo "::notice title=Advisory ignore list::$FILE: $msg" ;;
              id)      ids+=("$msg") ;;
              '')      : ;;
              *)       echo "::error title=Advisory ignore list::unexpected evaluator output: $kind"; errors=$((errors+1)) ;;
            esac
          done <<<"$result"

          if [ "$errors" -gt 0 ]; then
            echo "$errors problem(s) in $FILE. Nothing is ignored until they are fixed."
            exit 1
          fi
          joined=$(IFS=,; echo "${ids[*]:-}")
          echo "ids=$joined" >> "$GITHUB_OUTPUT"
          echo "Acknowledged advisories: ${joined:-none}"

      - name: hex.audit (retired packages + advisories)
        env:
          HEX_IGNORE_ADVISORIES: ${{ steps.audit_ignores.outputs.ids }}
        run: |
          unset HEX_IGNORE_RETIREMENTS
          mix hex.audit
        continue-on-error: ${{ contains(inputs.nonblocking, 'hex_audit') }}

      - name: deps.audit (Hex CVEs)
        env:
          IGNORE_IDS: ${{ steps.audit_ignores.outputs.ids }}
        run: |
          if [ -n "$IGNORE_IDS" ]; then
            mix deps.audit --ignore-advisory-ids "$IGNORE_IDS"
          else
            mix deps.audit
          fi
        continue-on-error: ${{ contains(inputs.nonblocking, 'deps_audit') }}

      # STALE ENTRIES WARN, NEVER FAIL. An entry no tool reports any more -- the package was
      # upgraded or dropped -- is harmless but is a standing exception nobody needs, so say
      # so. Re-runs both tools WITHOUT ignores and looks for each id (or alias) in what
      # they report. If either tool could not run, it says it cannot tell rather than
      # calling every entry stale.
      - name: Advisory ignore list — stale entries (warning only)
        if: ${{ (success() || failure()) && steps.audit_ignores.outputs.ids != '' }}
        continue-on-error: true
        env:
          IGNORE_IDS: ${{ steps.audit_ignores.outputs.ids }}
        run: |
          set -uo pipefail
          unset HEX_IGNORE_ADVISORIES HEX_IGNORE_RETIREMENTS
          d="${RUNNER_TEMP:-/tmp}/audit-stale"; mkdir -p "$d"
          mix hex.audit > "$d/hex.txt" 2>&1; hex_rc=$?
          mix deps.audit --format json > "$d/mixaudit.json" 2>/dev/null; mix_rc=$?
          # "Ran" means the tool produced its own verdict, not merely an exit code: both
          # can exit non-zero for a Mix error as well as for a finding.
          hex_ran=no
          if { [ "$hex_rc" -le 1 ] && grep -qE '^(Advisories:|Retired:|No retired or security advisory packages found)' "$d/hex.txt"; }; then hex_ran=yes; fi
          mix_ran=no
          if jq -e '.vulnerabilities | type == "array"' "$d/mixaudit.json" >/dev/null 2>&1; then mix_ran=yes; fi
          if [ "$hex_ran" = no ] || [ "$mix_ran" = no ]; then
            echo "::notice title=Advisory ignore list::could not re-run both audits (hex.audit: $hex_ran, deps.audit: $mix_ran) — stale entries not checked."
            exit 0
          fi
          jq -r '.vulnerabilities[] | .advisory.id // empty' "$d/mixaudit.json" > "$d/mix-ids.txt"
          IFS=, read -ra ids <<<"$IGNORE_IDS"
          for id in "${ids[@]}"; do
            if grep -qiwF -- "$id" "$d/hex.txt" || grep -qixF -- "$id" "$d/mix-ids.txt"; then
              echo "in use: $id"
            else
              echo "::warning title=Advisory ignore list::.audit-ignore.yml entry $id is not reported by hex.audit or deps.audit any more — remove it."
            fi
          done

      # --- CI-computed security/freshness posture → workflow-run artifact (issue #106 Option A) ---
      # Re-runs the scanners in machine-readable mode, folds their results into ONE JSON
      # file, and uploads it as the `cobenian-scan-posture` artifact. Foundry's GitHub
      # connector (cobenian-foundry SPEC-CON-003 §14, CON-GH-028…034) reads this artifact
      # off the completed workflow run and emits `connectors.scan_result.received` for
      # Cobenian Panel's app & security monitor — with NO CI credential and NO Foundry
      # endpoint. This is issue #106 Option A: it replaces the reverted POST-with-bearer
      # emitter (PR #11, reverted by #12). Only the *transport* changed — artifact upload
      # instead of an authenticated POST to /api/events. There is deliberately no
      # FOUNDRY_INGEST_TOKEN and no network call to Foundry here.
      #
      # NON-BLOCKING & always-on: `continue-on-error: true` + `if: always()` + internal
      # `|| true` guards — this step can NEVER fail a caller's build, and it still runs
      # when an earlier blocking scanner failed the job (posture is most useful on a
      # failing build). The existing blocking scanner steps above are unchanged and still
      # own pass/fail.
      #
      # CONTRACT (cobenian-foundry SPEC-CON-003 §14): the file body IS the flat scan-result
      # payload — source / repo / head_sha / run_url / workflow_run_id / scanned_at plus one
      # section per scanner. A scanner that did not run or failed is OMITTED — never
      # fabricated as clean. The connector validates source/repo/head_sha and passes the
      # scanner sub-objects through verbatim (counts-only for sobelow/gitleaks).
      #
      # SECRETS DISCIPLINE (cobenian-foundry CON-GH-015): gitleaks contributes a COUNT
      # only — never a secret value or its file/line location. Sobelow contributes COUNTS
      # only — no source snippets. The raw scanner report files stay in .scan/ on the
      # runner and are NEVER uploaded; only the folded scan-posture.json (counts + advisory
      # metadata) becomes the artifact.
      - name: Build scan posture (issue #106 Option A)
        if: ${{ always() }}
        continue-on-error: true
        env:
          PROFILE: ${{ inputs.profile }}
          SOBELOW_ROOT: ${{ inputs.sobelow_root }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
          # Whether the dependency tree exists at all. Every Mix-based scanner needs it.
          DEPS_OK: ${{ steps.deps.outcome == 'success' }}
        run: |
          # NOTE: no `set -e` / no `set -x`. We must never fail the build.
          set -uo pipefail
          mkdir -p .scan

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SCANNED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Base payload — always present, the minimal identity the connector validates
          # and Panel folds on. run_url/workflow_run_id/head_sha are included for
          # completeness even though the connector overrides them from the actual run.
          BASE="$(jq -n \
            --arg source "github" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            --arg wf_id "$GITHUB_RUN_ID" \
            --arg scanned_at "$SCANNED_AT" \
            '{source:$source, repo:$repo, head_sha:$sha, run_url:$run_url,
              workflow_run_id:$wf_id, scanned_at:$scanned_at}')"

          # Each section defaults to `null` (= did not run / unparseable → OMITTED). A
          # scanner that ran and legitimately found nothing yields 0 / [] (honest empty).
          #
          # TWO WAYS THAT DISTINCTION WAS BEING LOST, both found on a real run:
          # imsearch/searchlink-assay 33995805827, where `mix deps.get` failed on a private
          # Hex package and ten verification steps were skipped -- and this step still
          # published `hex_audit: []`, `hex_outdated: []`, `gitleaks: {secrets_found: 0}`.
          # A clean security posture from a run in which nothing was scanned.
          #
          #   1. `jq -sc .` ON EMPTY INPUT PRINTS `[]`, NEVER null. So an awk parse that
          #      matched nothing -- because the tool printed an error rather than a table --
          #      is byte-identical to one that matched nothing because there was nothing to
          #      find. The `|| echo null` fallback never fires: the pipeline SUCCEEDS.
          #
          #   2. `mix hex.audit` and `mix hex.outdated` EXIT 0 WHEN THEY CANNOT RUN. With no
          #      dependency tree they exit 0 having done nothing, so the `then` branch fires
          #      and assigns the honest-empty `[]` directly. Verified by reproduction outside
          #      a Mix project: exit code 0, and `[]`.
          #
          # So an exit code is not enough on its own. `DEPS_OK` is the precondition: without
          # a dependency tree no Mix-based scanner can have looked, whatever it exited with.
          if [ "$DEPS_OK" != "true" ]; then
            echo "deps.get did not succeed — every Mix-based scanner is UNKNOWN, not clean." >&2
          fi

          # --- Sobelow (apps only): counts + by_confidence, NO snippets ---
          SOBELOW='null'
          if [ "$PROFILE" = "app" ] && [ "$DEPS_OK" = "true" ]; then
            # `--skip` matches the gate step above, so the digest's counts agree with what
            # actually fails a build. Without it the digest would keep reporting findings CI
            # treats as suppressed.
            mix sobelow --format json --skip --root "$SOBELOW_ROOT" > .scan/sobelow.json 2>/dev/null || true
            if jq -e . .scan/sobelow.json >/dev/null 2>&1; then
              SOBELOW="$(jq '
                (.findings.high_confidence // [] | length) as $h
                | (.findings.medium_confidence // [] | length) as $m
                | (.findings.low_confidence // [] | length) as $l
                | {findings: ($h+$m+$l),
                   by_confidence: {high:$h, medium:$m, low:$l}}' \
                .scan/sobelow.json 2>/dev/null || echo null)"
            fi
          fi

          # --- mix_audit (Hex CVEs): list of {package,id,severity,title} ---
          MIX_AUDIT='null'
          if [ "$DEPS_OK" = "true" ]; then
            mix deps.audit --format json > .scan/mixaudit.json 2>/dev/null || true
          fi
          if [ "$DEPS_OK" = "true" ] && jq -e . .scan/mixaudit.json >/dev/null 2>&1; then
            MIX_AUDIT="$(jq '[.vulnerabilities[]? | {
              package: (.advisory.package // .dependency.package // null),
              id: (.advisory.cve // .advisory.id // null),
              severity: (.advisory.severity // null),
              title: (.advisory.title // null)
            }]' .scan/mixaudit.json 2>/dev/null || echo null)"
          fi

          # --- hex.audit (retired packages): list of {package,version,reason} ---
          # Text output only (no JSON format). exit 0 = none retired (honest []);
          # exit 1 = retired found → best-effort parse; anything else → null (omit).
          HEX_AUDIT='null'
          if [ "$DEPS_OK" != "true" ]; then
            : # no dependency tree — this scanner cannot have looked. Stays null.
          elif mix hex.audit > .scan/hexaudit.txt 2>/dev/null; then
            HEX_AUDIT='[]'
          elif [ $? -eq 1 ]; then
            HEX_AUDIT="$(awk '
              /^[[:space:]]*\*?[[:space:]]*[A-Za-z0-9_]+[[:space:]]+[0-9]/ {
                pkg=$1; if (pkg=="*") pkg=$2;
                ver=""; for (i=1;i<=NF;i++) if ($i ~ /^[0-9]+\.[0-9]/) {ver=$i; break}
                reason=$0; sub(/^[^:]*:[[:space:]]*/, "", reason);
                gsub(/"/, "\\\"", reason);
                printf "{\"package\":\"%s\",\"version\":\"%s\",\"reason\":\"%s\"}\n", pkg, ver, reason
              }' .scan/hexaudit.txt | jq -sc . 2>/dev/null || echo null)"
            # AN EMPTY PARSE OF NON-EMPTY OUTPUT IS A FAILED PARSE. `jq -sc .` prints `[]`
            # for empty input and never null, so a table this awk could not read becomes
            # "ran, found nothing" -- the exact shape being fixed here. The tool exited 1,
            # which means it HAD something to report, so parsing zero rows out of it is this
            # script's failure to read, not the tool's finding of nothing.
            if [ "$HEX_AUDIT" = "[]" ] && [ -s .scan/hexaudit.txt ]; then
              HEX_AUDIT='null'
            fi
          fi

          # --- gitleaks (secret scan): COUNT ONLY — never value or location ---
          GITLEAKS='null'
          # Normally ./gitleaks already exists (cache hit or the blocking step above);
          # only fetch as a last resort, and even then resiliently + non-fatally.
          if [ ! -x ./gitleaks ]; then
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
              -o gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              2>/dev/null && tar -xzf gitleaks.tar.gz gitleaks 2>/dev/null || true
            rm -f gitleaks.tar.gz
          fi
          if [ -x ./gitleaks ]; then
            ./gitleaks detect --source . --redact --no-banner \
              --report-format json --report-path .scan/gitleaks.json --exit-code 0 \
              >/dev/null 2>&1 || true
            if jq -e . .scan/gitleaks.json >/dev/null 2>&1; then
              N="$(jq 'length' .scan/gitleaks.json 2>/dev/null)"
              case "$N" in
                ''|*[!0-9]*) : ;;
                *) GITLEAKS="$(jq -n --argjson n "$N" '{secrets_found:$n}')" ;;
              esac
            fi
          fi

          # --- hex.outdated: list of {package,current,latest} ---
          # PARSED BY HEADER OFFSET, NOT BY FIELD POSITION. `mix hex.outdated` prints a
          # fixed-width TABLE whose columns are not whitespace-delimited fields:
          #
          #   Dependency               Only      Current  Latest  Status
          #   oban                               2.24.0   2.24.1  Update possible
          #   dialyxir                 dev,test  1.4.7    1.4.8   Update possible
          #
          # `Only` is blank on most rows and `Status` is two words, so the Nth field means
          # different things on different rows. The previous awk read `$2` as the current
          # version, so every row with `Only` populated -- every dev-only dependency -- was
          # dropped. Zero rows parsed became `hex_outdated: []`, "everything current",
          # published to a security monitor by every repository on this workflow while they
          # held outdated dependencies. Issue #57.
          #
          # THE EXIT CODE IS NO LONGER CONSULTED. It was overloaded three ways: 0 for "all
          # current" AND for "could not run at all", 1 for "some outdated" AND for a Mix
          # error. The table decides instead. A recognised header means a table was produced
          # and its contents are the answer; no header means unparseable, which is `null` and
          # never `[]`. That matters most here, because `hex.outdated` writes its auth
          # warnings to STDOUT -- so this text is rarely empty even with no table in it.
          HEX_OUTDATED='null'
          if [ "$DEPS_OK" = "true" ]; then
            mix hex.outdated > .scan/outdated.txt 2>/dev/null || true
            HEX_OUTDATED="$(awk '
              # Locate the header and take each column'"'"'s START COLUMN from it. A column
              # added, removed or renamed then shifts an offset rather than silently
              # changing what a field means.
              !seen && /Dependency/ && /Current/ && /Latest/ && /Status/ {
                seen = 1
                cDep = index($0, "Dependency"); cOnly = index($0, "Only")
                cCur = index($0, "Current");    cLat  = index($0, "Latest")
                cSta = index($0, "Status")
                next
              }
              seen {
                # Slice to the NEXT column start, so a blank cell stays blank rather than
                # letting the following column slide into its place.
                dep = substr($0, cDep, (cOnly ? cOnly : cCur) - cDep)
                cur = substr($0, cCur, cLat - cCur)
                lat = substr($0, cLat, cSta - cLat)
                sta = substr($0, cSta)
                gsub(/^[ \t]+|[ \t]+$/, "", dep); gsub(/^[ \t]+|[ \t]+$/, "", cur)
                gsub(/^[ \t]+|[ \t]+$/, "", lat); gsub(/^[ \t]+|[ \t]+$/, "", sta)
                if (dep !~ /^[A-Za-z0-9_]+$/) next
                if (cur !~ /^[0-9]+\.[0-9]/ || lat !~ /^[0-9]+\.[0-9]/) next
                # THE STATUS COLUMN DECIDES. Inferring from cur != lat re-implements hex'"'"'s
                # own judgement about what a requirement admits, which is the same class of
                # mistake as reading the table positionally.
                if (tolower(sta) ~ /^up-to-date/) next
                printf "{\"package\":\"%s\",\"current\":\"%s\",\"latest\":\"%s\"}\n", dep, cur, lat
              }
              END { if (!seen) exit 3 }
            ' .scan/outdated.txt | jq -sc . 2>/dev/null)"
            # awk exits 3 when it never saw a header: unparseable, not empty.
            if [ "${PIPESTATUS[0]:-0}" = "3" ] || [ -z "$HEX_OUTDATED" ]; then
              HEX_OUTDATED='null'
            fi
          fi

          # Fold present sections into the payload; omit any that stayed null.
          PAYLOAD="$(echo "$BASE" | jq \
            --argjson sobelow "$SOBELOW" \
            --argjson mix_audit "$MIX_AUDIT" \
            --argjson hex_audit "$HEX_AUDIT" \
            --argjson gitleaks "$GITLEAKS" \
            --argjson hex_outdated "$HEX_OUTDATED" '
            . + (if $sobelow      == null then {} else {sobelow:      $sobelow}      end)
              + (if $mix_audit    == null then {} else {mix_audit:    $mix_audit}    end)
              + (if $hex_audit    == null then {} else {hex_audit:    $hex_audit}    end)
              + (if $gitleaks     == null then {} else {gitleaks:     $gitleaks}     end)
              + (if $hex_outdated == null then {} else {hex_outdated: $hex_outdated} end)')"

          # Write the ONE JSON file that becomes the artifact body. It lives at the
          # workspace root — NOT under .scan/ — so the raw scanner reports (which may carry
          # secret locations / source snippets) can never be swept into the upload.
          echo "$PAYLOAD" | jq . > scan-posture.json

          echo "Built scan posture for ${GITHUB_REPOSITORY}@${HEAD_SHA}:"
          jq . scan-posture.json   # counts only — safe to log; contains no secrets

      - name: Upload scan posture artifact (issue #106 Option A)
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # MUST equal the connector default GITHUB_SCAN_ARTIFACT_NAME — the Foundry
          # GitHub connector looks the artifact up by this exact name.
          name: cobenian-scan-posture
          # Exactly ONE file → the artifact contains exactly one JSON body, as the
          # connector's parser requires.
          path: scan-posture.json
          if-no-files-found: warn
          retention-days: 7
