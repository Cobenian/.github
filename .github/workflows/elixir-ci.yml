# REUSABLE CI workflow — canonical for all Cobenian repos.
#
# DESTINATION: Cobenian/.github repo at .github/workflows/elixir-ci.yml
# Consumed by each repo's thin .github/workflows/ci.yml via:
#   uses: Cobenian/.github/.github/workflows/elixir-ci.yml@v1
#
# Staged here under org-github-repo/.github/workflows/ (mirrors the real path) for
# review; it is NOT under THIS repo's .github/, so GitHub won't run it here.
#
# Merged from the cobenian-cadence and cobenian-accounts sessions. Implements
# STANDARDS.md §3 (CI) with the §10 `nonblocking` ratchet.
name: Elixir CI (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "app | library (required — forces an explicit choice)"
        type: string
        required: true
      umbrella:
        description: "true for umbrella apps (e.g. Companion)"
        type: boolean
        default: false
      postgres:
        description: "start a Postgres service + run ecto setup"
        type: boolean
        default: true
      nonblocking:
        description: >-
          Comma-separated checks to run report-only (continue-on-error) during a
          repo's cleanup ramp. Recognized: credo, sobelow, hex_audit, deps_audit.
          (Dialyzer is governed separately by `dialyzer_blocking`.)
        type: string
        default: ""
      dialyzer_blocking:
        description: "promote Dialyzer from report-only to blocking once PLTs are stable"
        type: boolean
        default: false
      sobelow_root:
        description: "Phoenix app root for Sobelow ('.' or 'apps/<web_app>' for umbrellas)"
        type: string
        default: "."
      migrations_path:
        description: "path to migrations for the duplicate-timestamp check"
        type: string
        default: "priv/repo/migrations"
      elixir-version:
        type: string
        default: "1.20.3"
      otp-version:
        type: string
        default: "29.0.5"
      postgres_image:
        type: string
        default: "postgres:17"
      gitleaks_version:
        type: string
        default: "8.21.2"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      db:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # Apps with hand-written migrations: fail fast on duplicate timestamps
      # (two PRs merged the same day can collide; only breaks once both land on main).
      - name: Check for duplicate migration versions
        if: ${{ inputs.profile == 'app' }}
        run: |
          dir="${{ inputs.migrations_path }}"
          [ -d "$dir" ] || { echo "No migrations dir ($dir) — skipping."; exit 0; }
          dupes=$(ls "$dir" | grep -E '^[0-9]+_' | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version(s): $dupes"; exit 1
          fi
          echo "No duplicate migration versions."

      # Fly clustering: an app running DNSCluster MUST name its node by a STABLE basename
      # (the release name), or its machines never cluster and LiveView reconnect-loops the
      # moment a 2nd machine autostarts. This was a silent, fleet-wide gap (DNSCluster
      # present, node-naming missing or keyed on the per-deploy image ref). Catch it here
      # instead of in prod. See STANDARDS.md §4 + templates/rel-env.sh.eex.
      - name: Fly clustering config (rel/env.sh.eex)
        if: ${{ inputs.profile == 'app' }}
        run: |
          if [ -z "$(grep -rl 'DNSCluster' apps lib 2>/dev/null | head -1)" ]; then
            echo "No DNSCluster — clustering config not required."; exit 0
          fi
          if [ ! -f rel/env.sh.eex ]; then
            echo "::error::App uses DNSCluster but rel/env.sh.eex is missing — its Fly machines won't cluster (LiveView reconnect-loops on >1 machine). Copy Cobenian/.github templates/rel-env.sh.eex. See STANDARDS.md §4."
            exit 1
          fi
          if grep -q 'FLY_IMAGE_REF' rel/env.sh.eex; then
            echo "::error::rel/env.sh.eex keys the node name on FLY_IMAGE_REF — that changes every deploy, so the machines never match and Node.list() stays empty. Name the node by the release name (<%= @release.name %>)."
            exit 1
          fi
          grep -q 'RELEASE_NODE' rel/env.sh.eex || { echo "::error::rel/env.sh.eex does not set RELEASE_NODE."; exit 1; }
          echo "Clustering config present with a stable node basename."

      # Log attribution: a spawned Task/process does NOT inherit the caller's Logger metadata,
      # so one that logs inside an attributed request/job produces unattributed lines. The fleet
      # UnattributedSpawn credo check (shipped in cobenian_core_platform) catches that — but only
      # if it's enabled AND actually loaded. It ships behind `if Code.ensure_loaded?(Credo.Check)`
      # and credo isn't on the dep's compile path, so a `.credo.exs` `requires:` entry is needed
      # or credo silently "Ignores an undefined check" and the guard is inert. Assert both here so
      # a new app can't forget it. See STANDARDS.md §3 + templates/credo.exs.
      - name: Log-attribution guard (.credo.exs UnattributedSpawn)
        if: ${{ inputs.profile == 'app' }}
        run: |
          if ! grep -rlq --include=mix.exs 'cobenian_core_platform' . 2>/dev/null; then
            echo "App does not depend on cobenian_core_platform — spawn-attribution guard not applicable."; exit 0
          fi
          [ -f .credo.exs ] || { echo "::error::.credo.exs is missing — can't enable the UnattributedSpawn log-attribution guard. Run 'mix credo.gen.config' and start from Cobenian/.github templates/credo.exs. See STANDARDS.md §3."; exit 1; }
          if ! grep -q 'Cobenian.CorePlatform.Logging.Credo.UnattributedSpawn' .credo.exs; then
            echo "::error::.credo.exs does not enable the UnattributedSpawn guard — a spawned Task/process that logs would go unattributed. Add {Cobenian.CorePlatform.Logging.Credo.UnattributedSpawn, []} to checks.enabled (see templates/credo.exs). STANDARDS.md §3."
            exit 1
          fi
          if ! grep -q 'core_platform/logging/credo' .credo.exs; then
            echo "::error::.credo.exs enables UnattributedSpawn but never loads it via requires: — credo silently ignores it and the guard is inert. Add the dep source to requires: (deps/cobenian_core_platform/lib/cobenian/core_platform/logging/credo/unattributed_spawn.ex). See templates/credo.exs + STANDARDS.md §3."
            exit 1
          fi
          echo "UnattributedSpawn log-attribution guard enabled and loaded."

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-mix-

      # Authenticate to a private Cobenian Hex organization when a key is provided
      # (repos with private Hex deps set the HEX_ORG_KEY secret; others no-op). Must
      # run before deps.get so private packages resolve.
      - name: Authenticate private Hex organization
        env:
          HEX_ORG_KEY: ${{ secrets.HEX_ORG_KEY }}
        run: |
          if [ -n "$HEX_ORG_KEY" ]; then
            mix hex.organization auth cobenian --key "$HEX_ORG_KEY"
          fi

      - run: mix deps.get

      # --- blocking hygiene + correctness (check variants — never auto-fix) ---
      - name: deps.unlock --check-unused
        run: mix deps.unlock --check-unused
      - name: format --check-formatted
        run: mix format --check-formatted
      - name: compile --warnings-as-errors
        run: mix compile --warnings-as-errors

      # --- quality + security (ratchetable via `nonblocking`) ---
      - name: credo --strict
        run: mix credo --strict
        continue-on-error: ${{ contains(inputs.nonblocking, 'credo') }}

      # `--skip` honours `@sobelow_skip ["Check.Name"]` on a function. Without it the
      # annotation is silently inert, so a verified false positive has no way to be recorded
      # in the code next to the mitigation that makes it false — the only alternatives being
      # a repo-wide ignore list (too blunt: it hides genuine future findings of that check)
      # or leaving sobelow non-blocking forever. Suppression stays per-function and reviewable
      # in the diff.
      - name: sobelow (apps only)
        if: ${{ inputs.profile == 'app' }}
        run: mix sobelow --exit --skip --root ${{ inputs.sobelow_root }}
        continue-on-error: ${{ contains(inputs.nonblocking, 'sobelow') }}

      - name: hex.audit (retired packages)
        run: mix hex.audit
        continue-on-error: ${{ contains(inputs.nonblocking, 'hex_audit') }}

      - name: deps.audit (Hex CVEs)
        run: mix deps.audit
        continue-on-error: ${{ contains(inputs.nonblocking, 'deps_audit') }}

      # --- DB + tests ---
      - name: Set up test database
        if: ${{ inputs.postgres }}
        run: mix ecto.create --quiet && mix ecto.migrate --quiet
      - name: test
        run: mix test

      # --- Dialyzer (report-only until dialyzer_blocking: true) ---
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-plt-v2-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-plt-v2-
      - name: Dialyzer
        run: mix dialyzer --format github
        continue-on-error: ${{ !inputs.dialyzer_blocking }}

      # --- secret scanning (replaces GHAS; runs on all repos) ---
      # gitleaks CLI binary, NOT gitleaks-action@v2 — the action requires a paid
      # license for organization accounts (Cobenian is an org); the binary is free.
      # Pin the version and bump deliberately. See STANDARDS.md §5.
      # Cache the pinned gitleaks binary across runs, keyed on its version. On a hit
      # the binary is restored to ./gitleaks and NO network fetch happens — the fewer
      # times we hit the GitHub release CDN, the fewer chances a transient 5xx blip
      # (as happened 2026-07-24) can touch the build. Both this blocking step and the
      # non-blocking scan-posture step below reuse the same ./gitleaks.
      - name: Cache gitleaks binary
        uses: actions/cache@v5
        with:
          path: ./gitleaks
          key: gitleaks-${{ runner.os }}-${{ inputs.gitleaks_version }}

      - name: gitleaks (secret scan)
        run: |
          v="${{ inputs.gitleaks_version }}"
          # Fetch the binary resiliently: a transient release-CDN 5xx (e.g. a 504) must
          # NOT hard-fail CI — only real secret findings may. curl retries transient
          # errors itself; the outer loop also covers a truncated tar extraction, and a
          # clean ::error:: is emitted only if every attempt is exhausted. Separate the
          # download from the extract (temp file, not a `curl | tar` pipe) so a partial
          # body is never streamed into tar. Skipped entirely on a cache hit.
          if [ ! -x ./gitleaks ]; then
            url="https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
            for attempt in 1 2 3; do
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
                   -o gitleaks.tar.gz "$url" \
                 && tar -xzf gitleaks.tar.gz gitleaks; then
                break
              fi
              echo "gitleaks fetch attempt ${attempt}/3 failed" >&2
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            rm -f gitleaks.tar.gz
          fi
          [ -x ./gitleaks ] || { echo "::error::Could not fetch gitleaks v${v} after 3 attempts (transient download failure — not a secret finding)"; exit 1; }
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      # --- CI-computed security/freshness posture → workflow-run artifact (issue #106 Option A) ---
      # Re-runs the scanners in machine-readable mode, folds their results into ONE JSON
      # file, and uploads it as the `cobenian-scan-posture` artifact. Foundry's GitHub
      # connector (cobenian-foundry SPEC-CON-003 §14, CON-GH-028…034) reads this artifact
      # off the completed workflow run and emits `connectors.scan_result.received` for
      # Cobenian Panel's app & security monitor — with NO CI credential and NO Foundry
      # endpoint. This is issue #106 Option A: it replaces the reverted POST-with-bearer
      # emitter (PR #11, reverted by #12). Only the *transport* changed — artifact upload
      # instead of an authenticated POST to /api/events. There is deliberately no
      # FOUNDRY_INGEST_TOKEN and no network call to Foundry here.
      #
      # NON-BLOCKING & always-on: `continue-on-error: true` + `if: always()` + internal
      # `|| true` guards — this step can NEVER fail a caller's build, and it still runs
      # when an earlier blocking scanner failed the job (posture is most useful on a
      # failing build). The existing blocking scanner steps above are unchanged and still
      # own pass/fail.
      #
      # CONTRACT (cobenian-foundry SPEC-CON-003 §14): the file body IS the flat scan-result
      # payload — source / repo / head_sha / run_url / workflow_run_id / scanned_at plus one
      # section per scanner. A scanner that did not run or failed is OMITTED — never
      # fabricated as clean. The connector validates source/repo/head_sha and passes the
      # scanner sub-objects through verbatim (counts-only for sobelow/gitleaks).
      #
      # SECRETS DISCIPLINE (cobenian-foundry CON-GH-015): gitleaks contributes a COUNT
      # only — never a secret value or its file/line location. Sobelow contributes COUNTS
      # only — no source snippets. The raw scanner report files stay in .scan/ on the
      # runner and are NEVER uploaded; only the folded scan-posture.json (counts + advisory
      # metadata) becomes the artifact.
      - name: Build scan posture (issue #106 Option A)
        if: ${{ always() }}
        continue-on-error: true
        env:
          PROFILE: ${{ inputs.profile }}
          SOBELOW_ROOT: ${{ inputs.sobelow_root }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
        run: |
          # NOTE: no `set -e` / no `set -x`. We must never fail the build.
          set -uo pipefail
          mkdir -p .scan

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SCANNED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Base payload — always present, the minimal identity the connector validates
          # and Panel folds on. run_url/workflow_run_id/head_sha are included for
          # completeness even though the connector overrides them from the actual run.
          BASE="$(jq -n \
            --arg source "github" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            --arg wf_id "$GITHUB_RUN_ID" \
            --arg scanned_at "$SCANNED_AT" \
            '{source:$source, repo:$repo, head_sha:$sha, run_url:$run_url,
              workflow_run_id:$wf_id, scanned_at:$scanned_at}')"

          # Each section defaults to `null` (= did not run / unparseable → OMITTED). A
          # scanner that ran and legitimately found nothing yields 0 / [] (honest empty).

          # --- Sobelow (apps only): counts + by_confidence, NO snippets ---
          SOBELOW='null'
          if [ "$PROFILE" = "app" ]; then
            # `--skip` matches the gate step above, so the digest's counts agree with what
            # actually fails a build. Without it the digest would keep reporting findings CI
            # treats as suppressed.
            mix sobelow --format json --skip --root "$SOBELOW_ROOT" > .scan/sobelow.json 2>/dev/null || true
            if jq -e . .scan/sobelow.json >/dev/null 2>&1; then
              SOBELOW="$(jq '
                (.findings.high_confidence // [] | length) as $h
                | (.findings.medium_confidence // [] | length) as $m
                | (.findings.low_confidence // [] | length) as $l
                | {findings: ($h+$m+$l),
                   by_confidence: {high:$h, medium:$m, low:$l}}' \
                .scan/sobelow.json 2>/dev/null || echo null)"
            fi
          fi

          # --- mix_audit (Hex CVEs): list of {package,id,severity,title} ---
          MIX_AUDIT='null'
          mix deps.audit --format json > .scan/mixaudit.json 2>/dev/null || true
          if jq -e . .scan/mixaudit.json >/dev/null 2>&1; then
            MIX_AUDIT="$(jq '[.vulnerabilities[]? | {
              package: (.advisory.package // .dependency.package // null),
              id: (.advisory.cve // .advisory.id // null),
              severity: (.advisory.severity // null),
              title: (.advisory.title // null)
            }]' .scan/mixaudit.json 2>/dev/null || echo null)"
          fi

          # --- hex.audit (retired packages): list of {package,version,reason} ---
          # Text output only (no JSON format). exit 0 = none retired (honest []);
          # exit 1 = retired found → best-effort parse; anything else → null (omit).
          HEX_AUDIT='null'
          if mix hex.audit > .scan/hexaudit.txt 2>/dev/null; then
            HEX_AUDIT='[]'
          elif [ $? -eq 1 ]; then
            HEX_AUDIT="$(awk '
              /^[[:space:]]*\*?[[:space:]]*[A-Za-z0-9_]+[[:space:]]+[0-9]/ {
                pkg=$1; if (pkg=="*") pkg=$2;
                ver=""; for (i=1;i<=NF;i++) if ($i ~ /^[0-9]+\.[0-9]/) {ver=$i; break}
                reason=$0; sub(/^[^:]*:[[:space:]]*/, "", reason);
                gsub(/"/, "\\\"", reason);
                printf "{\"package\":\"%s\",\"version\":\"%s\",\"reason\":\"%s\"}\n", pkg, ver, reason
              }' .scan/hexaudit.txt | jq -sc . 2>/dev/null || echo null)"
          fi

          # --- gitleaks (secret scan): COUNT ONLY — never value or location ---
          GITLEAKS='null'
          # Normally ./gitleaks already exists (cache hit or the blocking step above);
          # only fetch as a last resort, and even then resiliently + non-fatally.
          if [ ! -x ./gitleaks ]; then
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
              -o gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              2>/dev/null && tar -xzf gitleaks.tar.gz gitleaks 2>/dev/null || true
            rm -f gitleaks.tar.gz
          fi
          if [ -x ./gitleaks ]; then
            ./gitleaks detect --source . --redact --no-banner \
              --report-format json --report-path .scan/gitleaks.json --exit-code 0 \
              >/dev/null 2>&1 || true
            if jq -e . .scan/gitleaks.json >/dev/null 2>&1; then
              N="$(jq 'length' .scan/gitleaks.json 2>/dev/null)"
              case "$N" in
                ''|*[!0-9]*) : ;;
                *) GITLEAKS="$(jq -n --argjson n "$N" '{secrets_found:$n}')" ;;
              esac
            fi
          fi

          # --- hex.outdated: list of {package,current,latest} ---
          # Text/table output only. exit 0 = all current (honest []); exit 1 = some
          # outdated → best-effort table parse; else null (omit).
          HEX_OUTDATED='null'
          if mix hex.outdated > .scan/outdated.txt 2>/dev/null; then
            HEX_OUTDATED='[]'
          elif [ $? -eq 1 ]; then
            HEX_OUTDATED="$(awk '
              NR>1 && $1 ~ /^[A-Za-z0-9_]+$/ && $2 ~ /^[0-9]+\.[0-9]/ && $3 ~ /^[0-9]+\.[0-9]/ && $2 != $3 {
                printf "{\"package\":\"%s\",\"current\":\"%s\",\"latest\":\"%s\"}\n", $1, $2, $3
              }' .scan/outdated.txt | jq -sc . 2>/dev/null || echo null)"
          fi

          # Fold present sections into the payload; omit any that stayed null.
          PAYLOAD="$(echo "$BASE" | jq \
            --argjson sobelow "$SOBELOW" \
            --argjson mix_audit "$MIX_AUDIT" \
            --argjson hex_audit "$HEX_AUDIT" \
            --argjson gitleaks "$GITLEAKS" \
            --argjson hex_outdated "$HEX_OUTDATED" '
            . + (if $sobelow      == null then {} else {sobelow:      $sobelow}      end)
              + (if $mix_audit    == null then {} else {mix_audit:    $mix_audit}    end)
              + (if $hex_audit    == null then {} else {hex_audit:    $hex_audit}    end)
              + (if $gitleaks     == null then {} else {gitleaks:     $gitleaks}     end)
              + (if $hex_outdated == null then {} else {hex_outdated: $hex_outdated} end)')"

          # Write the ONE JSON file that becomes the artifact body. It lives at the
          # workspace root — NOT under .scan/ — so the raw scanner reports (which may carry
          # secret locations / source snippets) can never be swept into the upload.
          echo "$PAYLOAD" | jq . > scan-posture.json

          echo "Built scan posture for ${GITHUB_REPOSITORY}@${HEAD_SHA}:"
          jq . scan-posture.json   # counts only — safe to log; contains no secrets

      - name: Upload scan posture artifact (issue #106 Option A)
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # MUST equal the connector default GITHUB_SCAN_ARTIFACT_NAME — the Foundry
          # GitHub connector looks the artifact up by this exact name.
          name: cobenian-scan-posture
          # Exactly ONE file → the artifact contains exactly one JSON body, as the
          # connector's parser requires.
          path: scan-posture.json
          if-no-files-found: warn
          retention-days: 7
