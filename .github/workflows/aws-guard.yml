# The guard, as a check every pull request must pass before it can merge (the caller's main
# requires it), whoever merges. It runs the caller's MAIN copy of its guard script against the
# pull request's diff and never runs the pull request's code. Callers trigger it from
# `pull_request_target`, which runs the BASE branch's copy of the caller workflow and would check
# out the base branch: so the checkout below names main explicitly, and a pull request whose base
# isn't main fails. Otherwise a branch pushed with a doctored bin/guard could serve as the base,
# turn the check green on the head sha, and the PR then be retargeted to main with the green check
# still standing. Callers must include `edited` (it fires when the base changes), so main's guard
# re-judges a retargeted PR.
#
# A person's own pull request passes: Bryan decides his own changes. A bot's or Dependabot's pull
# request that touches something the guard script reserves fails until the approver adds the
# approval label after its branch's latest push, as GitHub recorded it (a label added by anyone
# else, or before the latest push, doesn't count; commit dates are never trusted). aws-automerge
# applies the same check, in identical text.
#
# Each app owns its guard script (what it protects is that app's policy). Extracted from
# cobenian-company's guard.yml (2026-11-03). AWS apps call it at @v2.
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
#   jobs:
#     guard:
#       uses: Cobenian/.github/.github/workflows/aws-guard.yml@v2
name: Guard

on:
  workflow_call:
    inputs:
      elixir-version:
        description: Elixir for guard scripts that parse mix.exs/mix.lock (never runs the PR's code)
        type: string
        default: "1.20.5"
      otp-version:
        type: string
        default: "29.1.2"
      guard-command:
        description: The caller's guard script, run from main as `<command> <base> <head>`; exits 0 to pass, else prints the reasons
        type: string
        default: bin/guard
      approver:
        description: The only login whose label counts as approval
        type: string
        default: brweber2
      approval-label:
        description: The label the approver adds, after the latest push, to approve a held change
        type: string
        default: bryan-approved

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # main's tree, named explicitly: pull_request_target's default is the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: main, fetch-depth: 0 }

      # The app's guard may parse mix.exs and mix.lock with Elixir (Code.string_to_quoted: read,
      # never evaluated). Installing Elixir runs nothing from the pull request.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ inputs.otp-version }}
          elixir-version: ${{ inputs.elixir-version }}

      - name: Judge the change with main's guard
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GUARD: ${{ inputs.guard-command }}
          APPROVER: ${{ inputs.approver }}
          LABEL: ${{ inputs.approval-label }}
        run: |
          # --- Approval check. IDENTICAL text in aws-guard.yml and aws-automerge.yml: change both. ---
          # Approved means all of:
          #   - the PR's head is still $HEAD_SHA, on a branch of this repository (a fork's PR is
          #     never approved by label);
          #   - the approval label is on the PR now;
          #   - the issue events show a `labeled` event for that label, by $APPROVER, created after
          #     the branch's latest push.
          # "Latest push" is GitHub's own record of the branch moving: the repository activity API
          # (GET /repos/{repo}/activity?ref=refs/heads/<branch>, newest first), whose entries
          # (push, force_push, branch_creation, ...) carry a server-side timestamp and the sha the
          # branch moved to. The newest entry must have moved the branch to $HEAD_SHA, or this
          # fails closed. A commit's author/committer dates are never used: whoever writes the
          # commit chooses them. Check-suite times aren't either: a sha pushed earlier to another
          # branch already has suites from before it became this PR's head.
          # Every page of events is read, and the matches are counted as lines.
          approved() {
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$N") || { echo "Couldn't read PR #$N."; return 1; }
            if [ "$(printf '%s' "$pr" | jq -r .head.sha)" != "$HEAD_SHA" ]; then
              echo "PR #$N has moved past $HEAD_SHA."; return 1
            fi
            if [ "$(printf '%s' "$pr" | jq -r .head.repo.full_name)" != "$GITHUB_REPOSITORY" ]; then
              echo "PR #$N's branch is in another repository; a label can't approve it."; return 1
            fi
            if ! printf '%s' "$pr" | jq -e --arg l "$LABEL" 'any(.labels[]; .name == $l)' >/dev/null; then
              echo "PR #$N doesn't carry $LABEL."; return 1
            fi
            ref=$(printf '%s' "$pr" | jq -r '"refs/heads/" + .head.ref | @uri')
            last=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/activity?ref=$ref&direction=desc&per_page=1" \
              --jq '.[0] | "\(.timestamp) \(.after)"') || { echo "Couldn't read the branch's push history."; return 1; }
            pushed=${last%% *}; after=${last#* }
            if [ "$after" != "$HEAD_SHA" ] || [ -z "$pushed" ] || [ "$pushed" = null ]; then
              echo "GitHub's newest record of the branch ('$last') isn't the push of $HEAD_SHA."; return 1
            fi
            count=$(gh api --paginate -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/issues/$N/events?per_page=100" \
              | jq -r --arg l "$LABEL" --arg who "$APPROVER" --arg t "$pushed" \
                  '.[] | select(.event == "labeled" and .label.name == $l and .actor.login == $who and .created_at > $t) | .created_at' \
              | grep -c .) || true
            if [ "${count:-0}" -gt 0 ]; then echo "$APPROVER added $LABEL after the latest push ($pushed)."; return 0; fi
            echo "No $LABEL label from $APPROVER after the latest push ($pushed)."; return 1
          }
          # --- End of the approval check. ---
          [ -n "$N" ] || { echo "::error::The guard must be triggered by pull_request_target."; exit 1; }
          # Only a PR into main can pass: a green check earned against another base would survive
          # a retarget to main on the same head sha.
          if [ "$BASE_REF" != main ]; then
            echo "::error::PR #$N targets '$BASE_REF', not main. The guard only passes pull requests into main."; exit 1
          fi
          if [ "$AUTHOR_TYPE" = User ]; then echo "A person's change ($AUTHOR): theirs to decide."; exit 0; fi
          git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
          if reasons=$($GUARD origin/main "$HEAD_SHA"); then echo "$reasons"; exit 0; fi
          echo "$reasons"
          if approved; then exit 0; fi
          echo "::error::This change needs $APPROVER: add the label $LABEL (as $APPROVER) after reading it, after its latest push."
          exit 1
