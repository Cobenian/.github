# The nightly check: runs every scan on an app whether or not its code changed, and sends one
# report to the upkeep bucket. The watcher (Cobenian/upkeep) reads that report each morning.
#
# A scan that can't look is a failure, never a pass. Every check records "pass" only from a positive
# result. If this job can't run or can't send, no report arrives, and the watcher goes red.
#
# It also scans the image the app is actually running (Trivy) for high and critical problems in
# Debian packages that Debian has already fixed. When there are any, it starts the app's Refresh
# (the rebuild that installs every available fix), waits for it, and scans again. The check
# passes only if the image running afterwards has none. Problems nobody has fixed yet don't fail
# it: the morning watcher already counts those from AWS's own scan.
#
#   on:
#     schedule: [{ cron: "7 6 * * *" }]
#     workflow_dispatch:
#   permissions: { contents: read, id-token: write, actions: write }
#   jobs:
#     check:
#       uses: Cobenian/.github/.github/workflows/nightly-check.yml@v2
#       with: { app: time, report-role: arn:aws:iam::353254935868:role/cobenian-upkeep-report-time }
#       secrets: inherit
name: Nightly check (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: The app's slug in the upkeep manifest
        type: string
        required: true
      report-role:
        description: The AWS role that may write this app's report
        type: string
        required: true
      bucket:
        type: string
        default: cobenian-upkeep-353254935868
      sobelow-args:
        type: string
        default: --exit --skip --root .
      mix-audit-version:
        description: Used when the app doesn't list mix_audit itself
        type: string
        default: "2.1.5"
      gitleaks-version:
        type: string
        default: "8.21.2"
      ecs-cluster:
        description: The app's ECS cluster; empty means cobenian-<app>
        type: string
        default: ""
      ecs-service:
        description: The app's ECS service; empty means cobenian-<app>
        type: string
        default: ""
      refresh-workflow:
        description: The app's rebuild workflow, started when a fix is waiting
        type: string
        default: refresh.yml
    secrets:
      HEX_ORG_KEY:
        required: false
      HEX_FLEET_KEY:
        required: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  check:
    name: Nightly check
    runs-on: ubuntu-latest
    # Room for a rebuild when the running image needs one.
    timeout-minutes: 100
    env:
      MIX_ENV: test
      CLUSTER: ${{ inputs.ecs-cluster || format('cobenian-{0}', inputs.app) }}
      SERVICE: ${{ inputs.ecs-service || format('cobenian-{0}', inputs.app) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Run every check
        env:
          HEX_ORG_KEY: ${{ secrets.HEX_ORG_KEY }}
          HEX_FLEET_KEY: ${{ secrets.HEX_FLEET_KEY }}
          SOBELOW_ARGS: ${{ inputs.sobelow-args }}
          MIX_AUDIT_VERSION: ${{ inputs.mix-audit-version }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -uo pipefail
          : > checks.jsonl
          record() { # <name> <pass|fail> [detail]
            jq -nc --arg n "$1" --arg s "$2" --arg d "${3:-}" \
              '{name: $n, status: $s} + (if $d == "" then {} else {detail: $d} end)' >> checks.jsonl
          }

          # Keys live for the fetch and no longer.
          [ -z "${HEX_ORG_KEY:-}" ] || mix hex.organization auth cobenian --key "$HEX_ORG_KEY"
          [ -z "${HEX_FLEET_KEY:-}" ] || mix hex.organization auth fleet --key "$HEX_FLEET_KEY"
          if mix deps.get > deps.log 2>&1; then deps=ok; else deps=failed; tail -20 deps.log; fi
          [ -z "${HEX_ORG_KEY:-}" ] || mix hex.organization deauth cobenian
          [ -z "${HEX_FLEET_KEY:-}" ] || mix hex.organization deauth fleet
          unset HEX_ORG_KEY HEX_FLEET_KEY

          if [ "$deps" = ok ]; then
            record "deps.get" pass

            # hex.audit can exit 0 without having looked, so it needs its positive sentence.
            if out=$(mix hex.audit 2>&1) && grep -Eq "No retired .*packages found" <<< "$out"; then
              record "hex.audit" pass
            else
              echo "$out" | tail -20
              record "hex.audit" fail "retired packages, or it could not check"
            fi

            if mix help deps.audit > /dev/null 2>&1; then
              audit=(mix deps.audit)
            else
              mix escript.install hex mix_audit "$MIX_AUDIT_VERSION" --force > /dev/null 2>&1
              audit=("$HOME/.mix/escripts/mix_audit")
            fi
            ids=$(grep -oE '(GHSA|CVE)-[A-Za-z0-9-]+' .audit-ignore.yml 2>/dev/null | sort -u | paste -sd, - || true)
            "${audit[@]}" --format json ${ids:+--ignore-advisory-ids "$ids"} > audit.json 2> audit.err
            if jq -e '.pass == true' audit.json > /dev/null 2>&1; then
              record "deps.audit" pass
            else
              n=$(jq -r '.vulnerabilities | length' audit.json 2>/dev/null || echo "")
              record "deps.audit" fail "${n:-unknown} vulnerable libraries, or it could not check"
            fi

            # shellcheck disable=SC2086
            if mix sobelow $SOBELOW_ARGS > sobelow.log 2>&1; then
              record "sobelow" pass
            else
              tail -30 sobelow.log
              record "sobelow" fail "findings, or it could not check"
            fi
          else
            record "deps.get" fail "libraries could not be fetched, so nothing that needs them ran"
          fi

          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o gitleaks.tar.gz "$url" \
             && tar -xzf gitleaks.tar.gz gitleaks; then
            if ./gitleaks detect --source . --redact --no-banner --exit-code 1; then
              record "gitleaks" pass
            else
              record "gitleaks" fail "possible secrets in the repository"
            fi
          else
            record "gitleaks" fail "could not be fetched"
          fi
          rm -f gitleaks.tar.gz

          # OSV carries the same advisories as GitHub. Actions' own token can't read Dependabot
          # alerts, and a stored token would be one more thing that can quietly stop working.
          if python3 - <<'PY'
          import json, re, sys, urllib.request

          def call(url, body=None):
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          lock = open("mix.lock", encoding="utf-8").read()
          packages = sorted(set(re.findall(r'\{:hex, :([a-z0-9_]+), "([^"]+)"', lock)))
          if not packages:
              sys.exit("no packages found in mix.lock")

          queries = [{"package": {"ecosystem": "Hex", "name": n}, "version": v} for n, v in packages]
          results = call("https://api.osv.dev/v1/querybatch", {"queries": queries})["results"]
          if len(results) != len(queries):
              sys.exit("OSV answered for the wrong number of packages")

          try:
              ignored = set(re.findall(r"(?:GHSA|CVE)-[A-Za-z0-9-]+", open(".audit-ignore.yml").read()))
          except FileNotFoundError:
              ignored = set()

          advisories = []
          for (name, version), result in zip(packages, results):
              for vuln in result.get("vulns") or []:
                  full = call(f"https://api.osv.dev/v1/vulns/{vuln['id']}")
                  if ignored & {full["id"], *full.get("aliases", [])}:
                      continue
                  advisories.append({
                      "id": full["id"],
                      "package": f"{name} {version}",
                      "severity": full.get("database_specific", {}).get("severity", "unknown"),
                      "opened_at": full.get("published"),
                  })
          json.dump(advisories, open("advisories.json", "w"))
          print(f"{len(packages)} packages checked, {len(advisories)} advisories")
          PY
          then
            record "advisories" pass
          else
            echo '[]' > advisories.json
            record "advisories" fail "could not be checked"
          fi

      # --- The running image -------------------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        id: aws-scan
        if: always()
        continue-on-error: true
        with:
          role-to-assume: ${{ inputs.report-role }}
          aws-region: us-east-1

      - name: Scan the running image for problems that have a fix
        id: scan
        if: always()
        timeout-minutes: 15
        env:
          SIGNED_IN: ${{ steps.aws-scan.outcome }}
          # A drill: with the caller repository's NIGHTLY_DRILL variable set to 1, a run started by
          # hand adds one made-up finding, so the rebuild, the wait and the rescan run for real.
          # Scheduled runs ignore it, so a variable left set can't fake a finding at night.
          DRILL: ${{ vars.NIGHTLY_DRILL == '1' && github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          # Trivy is downloaded, never installed from a third-party action: this version, checked
          # against this hash (the release's checksums file, whose Sigstore signature from Trivy's
          # own release workflow was verified when it was pinned). Change both together.
          cat > "$RUNNER_TEMP/image-scan.sh" <<'SH'
          TRIVY_VERSION=0.76.2
          TRIVY_SHA256=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          record() { # <pass|fail> [detail]
            jq -nc --arg s "$1" --arg d "${2:-}" \
              '{name: "image-fixes", status: $s} + (if $d == "" then {} else {detail: $d} end)' >> checks.jsonl
          }
          # The image the service runs now, from its task definition (never "latest").
          running_image() {
            local td
            td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].taskDefinition' --output text) || return 1
            [ -n "$td" ] && [ "$td" != None ] || return 1
            aws ecs describe-task-definition --task-definition "$td" --output json \
              --query 'taskDefinition.{image: containerDefinitions[0].image, arch: runtimePlatform.cpuArchitecture}' > running.json || return 1
            jq -e '.image | strings' running.json > /dev/null
          }
          # <out.json>: every high or critical problem with a fix, in the running image.
          scan_running() {
            running_image || { echo "::warning::Couldn't read the running image."; return 1; }
            local image arch registry
            image=$(jq -r .image running.json)
            arch=$(jq -r 'if .arch == "X86_64" then "amd64" else "arm64" end' running.json)
            registry=${image%%/*}
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" > /dev/null || return 1
            ./trivy image --quiet --no-progress --skip-version-check --timeout 10m --cache-dir .trivy \
              --image-src remote --platform "linux/$arch" --scanners vuln --pkg-types os,library \
              --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy.json "$image" || return 1
            # The scan must have read the image's operating system, or "nothing found" means nothing.
            jq -e '.Metadata.OS.Family | strings' trivy.json > /dev/null || return 1
            jq --arg image "$image" '[.Results[]? | .Class as $class | .Vulnerabilities[]?
                | select((.FixedVersion // "") != "")
                | {id: .VulnerabilityID, severity: .Severity, package: .PkgName,
                   installed: .InstalledVersion, fixed: .FixedVersion,
                   kind: (if $class == "os-pkgs" then "debian" else "library" end), image: $image}]
              | unique_by([.package, .installed, .fixed, .id])' trivy.json > "$1"
          }
          # "gzip 1.13-1 → 1.13-1+deb13u1, …" for a report line, at most eight.
          summary() {
            jq -r '[unique_by([.package, .installed, .fixed])[] | "\(.package) \(.installed) → \(.fixed)"]
              | (.[:8] | join(", ")) + (if length > 8 then ", and \(length - 8) more" else "" end)' "$1"
          }
          SH
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/image-scan.sh"
          echo '[]' > image-fixes.json

          [ "$SIGNED_IN" = success ] || { record fail "could not sign in to AWS to read the running image"; exit 0; }
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          if ! { curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o trivy.tar.gz "$url" \
                 && echo "$TRIVY_SHA256  trivy.tar.gz" | sha256sum -c --quiet \
                 && tar -xzf trivy.tar.gz trivy; }; then
            record fail "Trivy could not be fetched, or its checksum didn't match"; exit 0
          fi
          rm -f trivy.tar.gz

          scan_running before.json || { record fail "the running image could not be scanned"; exit 0; }
          if [ "$DRILL" = true ]; then
            echo "::notice::Drill: adding a made-up Debian finding (drill-test) so the rebuild runs."
            jq '. + [{id: "DRILL-0000", severity: "HIGH", package: "drill-test", installed: "1.0",
                      fixed: "1.0+drill", kind: "debian", image: "drill"}]' before.json > drill.json
            mv drill.json before.json
            touch "$RUNNER_TEMP/drill"
          fi
          cp before.json image-fixes.json
          debian=$(jq '[.[] | select(.kind == "debian")] | length' before.json)
          library=$(jq '[.[] | select(.kind == "library")] | length' before.json)
          echo "Problems with a fix in the running image: $debian in Debian packages, $library in libraries."
          if [ "$debian" = 0 ] && [ "$library" = 0 ]; then record pass; exit 0; fi
          if [ "$debian" = 0 ]; then
            # A rebuild only installs Debian's fixes; a library needs its version changed.
            record fail "$library problems with a fix need a library version change: $(summary before.json)"; exit 0
          fi
          # Debian has fixes the running image doesn't: the rebuild below installs them.
          echo "rebuild=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild to install the fixes
        id: rebuild
        if: always() && steps.scan.outputs.rebuild == 'true'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh-workflow }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          # If a rebuild is already going (tonight's, running late), wait for that one instead.
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$REFRESH" --limit 20 --json databaseId,status \
            --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
          if [ -z "$id" ]; then
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run "$REFRESH" -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
            for _ in $(seq 1 36); do
              sleep 5
              id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$REFRESH" --event workflow_dispatch \
                --created ">=$since" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
            done
          fi
          [ -n "$id" ] || { echo "result=did not start" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >> "$GITHUB_OUTPUT"
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 30 > /dev/null 2>&1 || true
          echo "result=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "unknown"')" >> "$GITHUB_OUTPUT"

      # Fresh credentials: the first ones may have expired while the rebuild ran.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        id: aws-rescan
        if: always() && steps.scan.outputs.rebuild == 'true'
        continue-on-error: true
        with:
          role-to-assume: ${{ inputs.report-role }}
          aws-region: us-east-1

      - name: Scan again after the rebuild
        if: always() && steps.scan.outputs.rebuild == 'true'
        timeout-minutes: 15
        env:
          SIGNED_IN: ${{ steps.aws-rescan.outcome }}
          RESULT: ${{ steps.rebuild.outputs.result || 'did not finish' }}
          RUN_URL: ${{ steps.rebuild.outputs.url }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/image-scan.sh"
          rebuild="The rebuild ${RUN_URL:+($RUN_URL) }ended: $RESULT."
          if [ "$SIGNED_IN" != success ] || ! scan_running after.json; then
            record fail "$(jq length before.json) problems with a fix were in the running image ($(summary before.json)), and it could not be scanned again. $rebuild"
            exit 0
          fi
          cp after.json image-fixes.json
          # Installed by the rebuild: in the first scan, gone from the second.
          jq --slurpfile after after.json '[.[] | select(. as $b | $after[0] | map(select(.package == $b.package and .id == $b.id)) | length == 0)]' \
            before.json > installed.json
          if [ "$(jq length installed.json)" != 0 ]; then
            note="Rebuilt to install Debian fixes: $(summary installed.json)"
            [ ! -e "$RUNNER_TEMP/drill" ] || note="Drill, started by hand. $note"
            jq -n --arg s "$note" '[$s]' > shipped.json
          fi
          if [ "$(jq length after.json)" = 0 ]; then
            record pass
          else
            record fail "$(jq length after.json) problems with a fix are still in the running image after a rebuild: $(summary after.json). $rebuild"
          fi

      - name: Write the report
        if: always()
        env:
          APP: ${{ inputs.app }}
        run: |
          [ -s checks.jsonl ] || { echo "::error::No checks ran."; exit 1; }
          [ -s image-fixes.json ] || echo '[]' > image-fixes.json
          [ -s shipped.json ] || echo '[]' > shipped.json
          # A scan that started but never recorded (cancelled, timed out) is a failure.
          grep -q '"name":"image-fixes"' checks.jsonl ||
            jq -nc '{name: "image-fixes", status: "fail", detail: "the running image scan did not finish"}' >> checks.jsonl
          jq -n \
            --arg app "$APP" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile checks <(jq -s . checks.jsonl) \
            --slurpfile advisories advisories.json \
            --slurpfile fixes image-fixes.json \
            --slurpfile shipped shipped.json \
            '{app: $app, generated_at: $at, commit: $commit, run: $run,
              checks: $checks[0], advisories: $advisories[0], held: [], shipped: $shipped[0],
              image_fixes: $fixes[0]}' > report.json
          jq . report.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        if: always()
        with:
          role-to-assume: ${{ inputs.report-role }}
          aws-region: us-east-1

      - name: Send the report
        if: always()
        env:
          APP: ${{ inputs.app }}
          BUCKET: ${{ inputs.bucket }}
        run: aws s3 cp report.json "s3://$BUCKET/reports/$APP/latest.json" --content-type application/json --no-progress

      - name: Fail this run if any check failed
        if: always()
        run: |
          failed=$(jq -r 'select(.status != "pass") | .name' checks.jsonl | paste -sd, -)
          [ -z "$failed" ] || { echo "::error::Failed: $failed"; exit 1; }
