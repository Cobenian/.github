# → .github/workflows/guard.yml in an AWS app. Make "guard / guard" a required check on main.
# The app's own bin/guard (copy cobenian-company's and adapt the protected paths) is the policy.
name: Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  guard:
    uses: Cobenian/.github/.github/workflows/aws-guard.yml@v2
